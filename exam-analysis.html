// PDF EXPORT (通用: 展开所有sub-tab内容)
// =============================================================
function exportPDF() {
  const btn = document.getElementById('btnExportPDF');
  btn.disabled = true;
  btn.textContent = '⏳ 导出中...';

  const cats = window._categories || [];
  if (!cats.length) { alert('请先生成分析报告'); btn.disabled = false; btn.textContent = '📦 导出图表'; return; }
  const examName = window._examName || '联考质量分析';

  const zip = new JSZip();
  let fileCount = 0;
  const addFile = (name, dataUrl) => {
    if (!dataUrl) return;
    zip.file(name, dataUrl.split(',')[1], { base64: true });
    fileCount++;
  };

  function getSubjKeys(cate) {
    const rows = (window._filteredRaw || []).filter(r => (r.category || '').includes(cate) || r.category === cate);
    return detectSubjects(rows);
  }

  function addChart(chartKey, folder, desc) {
    const ci = chartInstances[chartKey];
    const img = ci ? chartToImage(ci) : null;
    if (img) addFile(`${folder}/${desc}.png`, img);
  }

  function addTable(headers, rows, colWidths, folder, desc, fontSize) {
    if (!rows.length) return;
    const canvas = drawTableOnCanvas(headers, rows, colWidths, { fontSize: fontSize || 12 });
    addFile(`${folder}/${desc}.png`, canvas.toDataURL('image/png'));
  }

  // ======== PRE-EXPORT: render ALL charts for ALL categories ========
  const offscreenCanvases = [];

  // Helper: create off-screen canvas
  function createOffscreenCanvas(id, w, h) {
    const canvas = document.createElement('canvas');
    canvas.width = w || 1200;
    canvas.height = h || 600;
    canvas.id = id;
    canvas.style.cssText = 'position:absolute;left:-9999px;top:0;';
    document.body.appendChild(canvas);
    offscreenCanvases.push(canvas);
    return canvas;
  }

  // Render contribution charts for ALL categories
  for (let cate of cats) {
    const result = getResult(cate);
    if (!result || !result.contribResult) continue;
    const { validSchools, contribResult, subjKeys } = result;
    const schoolsWithData = validSchools.filter(s => contribResult.schools[s] && Object.keys(contribResult.schools[s]).length > 0);
    for (let si = 0; si < schoolsWithData.length; si++) {
      // Use _exp_ prefix to avoid ID collision with visible UI canvases
      const canvas = createOffscreenCanvas(`exp_chart_contrib_${cate}_${si}`);
      if (!canvas) continue;
      const chartKey = `contrib_${cate}_${si}`;
      destroyChart(chartKey);
      try {
        const sc = contribResult.schools[schoolsWithData[si]];
        const datasets = [];
        let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
        for (let sk of subjKeys) {
          const d = sc[sk];
          if (!d || d.refCount === 0) continue;
          const color = getSubjectColor(sk);
          const xVal = d.contribRate * 100;
          const yVal = d.hitRate * 100;
          if (xVal < xMin) xMin = xVal;
          if (xVal > xMax) xMax = xVal;
          if (yVal < yMin) yMin = yVal;
          if (yVal > yMax) yMax = yVal;
          datasets.push({
            label: keyToName(sk),
            data: [{ x: xVal, y: yVal, r: 8 }],
            backgroundColor: color + '88',
            borderColor: color,
            borderWidth: 2,
          });
        }
        if (datasets.length === 0) continue;
        const xPad = Math.max((xMax - xMin) * 0.15, 5);
        const yPad = Math.max((yMax - yMin) * 0.15, 5);
        const smartXMin = Math.max(0, Math.floor(xMin - xPad));
        const smartXMax = Math.min(100, Math.ceil(xMax + xPad));
        const smartYMin = Math.max(0, Math.floor(yMin - yPad));
        const smartYMax = Math.min(100, Math.ceil(yMax + yPad));
        chartInstances[chartKey] = new Chart(canvas, {
          type: 'bubble',
          data: { datasets },
          options: {
            responsive: true, maintainAspectRatio: true, aspectRatio: 2,
            animation: false,
            plugins: {
              legend: { position: 'top', labels: { font: { size: 18 } } },
              tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: 贡献率=${ctx.raw.x.toFixed(1)}%, 命中率=${ctx.raw.y.toFixed(1)}%` } },
              datalabels: { display: false }
            },
            scales: {
              x: { min: smartXMin, max: smartXMax, title: { display: true, text: '贡献率 (%)', font: { size: 18 } }, ticks: { font: { size: 16 }, callback: v => v + '%' }, grid: { color: '#e8e6dc' } },
              y: { min: smartYMin, max: smartYMax, title: { display: true, text: '命中率 (%)', font: { size: 18 } }, ticks: { font: { size: 16 }, callback: v => v + '%' }, grid: { color: '#e8e6dc' } },
            }
          }
        });
      } catch(e) {
        console.error('Export contrib chart error:', e, cate, schoolsWithData[si]);
      }
    }
  }

  // Render top students charts for ALL categories and ALL configs (top30/100/200)
  for (let cate of cats) {
    const result = getResult(cate);
    if (!result || result.error) continue;
    const { validSchools, topData, subjKeys, coreSubjKeys, otherSubjKeys } = result;
    const topConfigs = [{id:'top30',label:'前30名'},{id:'top100',label:'前100名'},{id:'top200',label:'前200名'}];
    const topLabels = ['前30名', '前100名', '前200名'];

    for (let ci = 0; ci < topConfigs.length; ci++) {
      const cfg = topConfigs[ci];
      const data = topData[cfg.id] ? topData[cfg.id].data : {};
      if (!data || Object.keys(data).length === 0) continue;

      // Chart 1: Core subjects + total
      const cvs1 = createOffscreenCanvas(`chart_top1_${cate}_${ci}`);
      if (cvs1) {
        destroyChart(`top1_${cate}_${ci}`);
        let barMin = Infinity, barMax = -Infinity;
        for (let sk of coreSubjKeys) {
          for (let s of validSchools) {
            const v = data[s]?.[sk] || 0;
            if (v < barMin) barMin = v;
            if (v > barMax) barMax = v;
          }
        }
        let totalMin = Infinity, totalMax = -Infinity;
        for (let s of validSchools) {
          const v = data[s]?.total || 0;
          if (v < totalMin) totalMin = v;
          if (v > totalMax) totalMax = v;
        }
        const yMin = 0;
        const yMax = barMax / 0.58;
        const totalRange = Math.max(totalMax - totalMin, 1);
        const y1Min = totalMin - 2.83 * totalRange;
        const y1Max = totalMax + 0.52 * totalRange;
        const barDatasets = coreSubjKeys.map((sk, si) => ({
          type: 'bar', label: keyToName(sk),
          data: validSchools.map(s => data[s]?.[sk] || 0),
          backgroundColor: getSubjectColor(sk),
          borderRadius: 4, yAxisID: 'y',
          datalabels: { anchor: 'end', align: 'end', offset: 20, color: '#333', font: { weight: 'bold', size: 15 }, formatter: v => v>0?v.toFixed(1):'' }
        }));
        const totalDataset = {
          type: 'line', label: '总分',
          data: validSchools.map(s => data[s]?.total || 0),
          borderColor: SUBJECT_COLORS.total, backgroundColor: 'transparent',
          pointBackgroundColor: SUBJECT_COLORS.total, pointRadius: 10, pointBorderColor: '#fff', pointBorderWidth: 2,
          showLine: false, yAxisID: 'y1', fill: false,
          datalabels: { anchor: 'end', align: 'top', offset: 24, color: SUBJECT_COLORS.total, font: { weight: 'bold', size: 17 }, formatter: v => v>0?v.toFixed(1):'' }
        };
        chartInstances[`top1_${cate}_${ci}`] = new Chart(cvs1, {
          type: 'bar', data: { labels: validSchools, datasets: [...barDatasets, totalDataset] },
          options: {
            responsive: true, maintainAspectRatio: true, aspectRatio: 2,
            plugins: {
              legend: { position: 'top', labels: { font: { size: 18 } } },
              datalabels: { display: ctx => ctx.dataset.type !== 'line' || ctx.dataset.label === '总分' }
            },
            scales: {
              y: { min: yMin, max: yMax, title: { display: true, text: '语数外均分', font: { size: 18 } }, ticks: { font: { size: 16 } }, grid: { color: '#e8e6dc' } },
              y1: { min: y1Min, max: y1Max, position: 'right', ticks: { display: false }, grid: { display: false } },
              x: { ticks: { font: { size: 16 } }, grid: { display: false } }
            }
          }
        });
      }

      // Chart 2: Other subjects
      if (otherSubjKeys.length > 0) {
        const cvs2 = createOffscreenCanvas(`chart_top2_${cate}_${ci}`);
        if (cvs2) {
          destroyChart(`top2_${cate}_${ci}`);
          let otherMin = Infinity, otherMax = -Infinity;
          for (let sk of otherSubjKeys) {
            for (let s of validSchools) {
              const v = data[s]?.[sk] || 0;
              if (v < otherMin) otherMin = v;
              if (v > otherMax) otherMax = v;
            }
          }
          const otherMargin = Math.max(5, (otherMax - otherMin) * 0.15);
          const otherYMin = Math.max(0, otherMin - otherMargin);
          const otherDatasets = otherSubjKeys.map((sk, si) => ({
            label: keyToName(sk),
            data: validSchools.map(s => data[s]?.[sk] || 0),
            backgroundColor: getSubjectColor(sk),
            borderRadius: 4,
            datalabels: { anchor: 'end', align: 'end', offset: 20, color: '#333', font: { weight: 'bold', size: 15 }, formatter: v => v>0?v.toFixed(1):'' }
          }));
          chartInstances[`top2_${cate}_${ci}`] = new Chart(cvs2, {
            type: 'bar', data: { labels: validSchools, datasets: otherDatasets },
            options: {
              responsive: true, maintainAspectRatio: true, aspectRatio: 2,
              plugins: {
                legend: { position: 'top', labels: { font: { size: 18 } } },
              },
              scales: { y: { min: otherYMin, title: { display: true, text: '均分', font: { size: 18 } }, ticks: { font: { size: 16 } }, grid: { color: '#e8e6dc' } }, x: { ticks: { font: { size: 16 } }, grid: { display: false } } }
            }
          });
        }
      }
    }

    // Trend chart
    if (result.trendLevels && result.trendLevels.length >= 2) {
      const cvsTrend = createOffscreenCanvas(`chart_trend_${cate}`);
      if (cvsTrend) {
        destroyChart(`trend_${cate}`);
        const datasets = validSchools.map((s,i) => ({
          label: s, data: result.trendData[s]||[],
          borderColor: getSchoolColor(s), backgroundColor: getSchoolColor(s),
          pointBackgroundColor: getSchoolColor(s), pointRadius: 6, pointHoverRadius: 10,
          borderWidth: 3, hoverBorderWidth: 5, tension: 0.3, fill: false,
          datalabels: { display: false }
        }));
        chartInstances[`trend_${cate}`] = new Chart(cvsTrend, {
          type: 'line', data: { labels: result.trendLevels, datasets },
          options: {
            responsive: true, maintainAspectRatio: true, aspectRatio: 2.2,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { position: 'top', labels: { font: { size: 18 } } },
              tooltip: {
                backgroundColor: '#141413', titleFont: { size: 16 },
                bodyFont: { size: 15 }, padding: 12, cornerRadius: 8,
                callbacks: { label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1) }
              }
            },
            hover: { mode: 'index', intersect: false },
            scales: {
              y: { beginAtZero: false, title: { display: true, text: '总分均分', font: { size: 18 } }, ticks: { font: { size: 16 } }, grid: { color: '#e8e6dc' } },
              x: { offset: true, ticks: { font: { size: 16, weight: 'bold' } }, grid: { display: false } }
            }
          }
        });
      }
    }
  }

  // Render cutoff charts for ALL categories
  for (let cate of cats) {
    const result = getResult(cate);
    if (!result || result.error) continue;
    const { validSchools, cutoffData } = result;
    const batchLines = window._batchLines[cate] || {};
    const batchNames = Object.keys(batchLines);
    const batchColors = ['#d97757','#6a9bcc','#788c5d','#8b6faf','#5a8f7b','#c47f5a'];

    if (batchNames.length === 0) continue;

    // Chart 1: Count (bar)
    const cvsCount = createOffscreenCanvas(`chart_cutoff_count_${cate}`);
    if (cvsCount) {
      destroyChart(`cutoff_count_${cate}`);
      const countDatasets = batchNames.map((batch, bi) => ({
        label: batch,
        data: validSchools.map(s => cutoffData[s]?.batches[batch]?.totalPass || 0),
        backgroundColor: batchColors[bi % batchColors.length] + 'cc',
        borderColor: batchColors[bi % batchColors.length], borderWidth: 2, borderRadius: 4,
        datalabels: { anchor: 'end', align: 'end', offset: 12, color: '#333', font: { weight: 'bold', size: 16 }, formatter: v => v > 0 ? v : '' }
      }));
      chartInstances[`cutoff_count_${cate}`] = new Chart(cvsCount, {
        type: 'bar',
        data: { labels: validSchools, datasets: countDatasets },
        options: {
          responsive: true, maintainAspectRatio: true, aspectRatio: 2,
          plugins: { legend: { position: 'top', labels: { font: { size: 18 } } } },
          scales: { y: { beginAtZero: true, title: { display: true, text: '上线人数', font: { size: 18 } }, ticks: { font: { size: 16 } }, grid: { color: '#e8e6dc' } }, x: { ticks: { font: { size: 16 } }, grid: { display: false } } }
        }
      });
    }

    // Chart 2: Rate (line)
    const cvsRate = createOffscreenCanvas(`chart_cutoff_rate_${cate}`);
    if (cvsRate) {
      destroyChart(`cutoff_rate_${cate}`);
      const rateDatasets = batchNames.map((batch, bi) => ({
        label: batch,
        data: validSchools.map(s => ((cutoffData[s]?.batches[batch]?.totalRate || 0) * 100)),
        borderColor: batchColors[bi % batchColors.length],
        backgroundColor: batchColors[bi % batchColors.length] + '22',
        pointBackgroundColor: batchColors[bi % batchColors.length], pointRadius: 7, borderWidth: 3, tension: 0.3, fill: false,
        datalabels: { display: false }
      }));
      chartInstances[`cutoff_rate_${cate}`] = new Chart(cvsRate, {
        type: 'line',
        data: { labels: validSchools, datasets: rateDatasets },
        options: {
          responsive: true, maintainAspectRatio: true, aspectRatio: 2,
          layout: { padding: { top: 10, left: 30, right: 30 } },
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top', labels: { font: { size: 18 } } },
            tooltip: {
              backgroundColor: '#141413', titleFont: { size: 16 },
              bodyFont: { size: 15 }, padding: 12, cornerRadius: 8,
              callbacks: { label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1) + '%' }
            }
          },
          scales: {
            y: { beginAtZero: true, max: 100, title: { display: true, text: '上线率 (%)', font: { size: 18 } }, ticks: { font: { size: 16 }, callback: v => v + '%' }, grid: { color: '#e8e6dc' } },
            x: { offset: true, ticks: { font: { size: 16 } }, grid: { display: false } }
          }
        }
      });
    }
  }

  // Render pct charts for ALL categories
  for (let cate of cats) {
    const result = getResult(cate);
    if (!result || result.error) continue;
    const { validSchools, pctData, subjKeys } = result;
    if (!pctData) continue;

    // Chart 1: Core subjects + total
    const cvs1 = createOffscreenCanvas(`chart_pct_1_${cate}`);
    if (cvs1) {
      destroyChart(`pct_1_${cate}`);
      const coreKeys = subjKeys.filter(k => ['yw','sx','yy','total'].includes(k));
      const coreSubjects = coreKeys.filter(k => k !== 'total');
      let barMin = Infinity, barMax = -Infinity;
      for (let sk of coreSubjects) {
        for (let s of validSchools) {
          const v = pctData[s]?.[sk] || 0;
          if (v < barMin) barMin = v;
          if (v > barMax) barMax = v;
        }
      }
      let totalMin = Infinity, totalMax = -Infinity;
      for (let s of validSchools) {
        const v = pctData[s]?.total || 0;
        if (v < totalMin) totalMin = v;
        if (v > totalMax) totalMax = v;
      }
      const yMin = 0;
      const yMax = barMax / 0.58;
      const totalRange = Math.max(totalMax - totalMin, 1);
      const y1Min = totalMin - 2.83 * totalRange;
      const y1Max = totalMax + 0.52 * totalRange;
      const barDatasets = coreSubjects.map((sk, si) => ({
        type: 'bar', label: keyToName(sk),
        data: validSchools.map(s => pctData[s]?.[sk] || 0),
        backgroundColor: getSubjectColor(sk),
        borderRadius: 4, yAxisID: 'y',
        datalabels: { anchor: 'end', align: 'end', offset: 20, color: '#333', font: { weight: 'bold', size: 15 }, formatter: v => v>0?v.toFixed(1):'' }
      }));
      const totalDataset = {
        type: 'line', label: '总分',
        data: validSchools.map(s => pctData[s]?.total || 0),
        borderColor: SUBJECT_COLORS.total, backgroundColor: 'transparent',
        pointBackgroundColor: SUBJECT_COLORS.total, pointRadius: 10, pointBorderColor: '#fff', pointBorderWidth: 2,
        showLine: false, yAxisID: 'y1', fill: false,
        datalabels: { anchor: 'end', align: 'top', offset: 24, color: SUBJECT_COLORS.total, font: { weight: 'bold', size: 17 }, formatter: v => v>0?v.toFixed(1):'' }
      };
      chartInstances[`pct_1_${cate}`] = new Chart(cvs1, {
        type: 'bar', data: { labels: validSchools, datasets: [...barDatasets, totalDataset] },
        options: {
          responsive: true, maintainAspectRatio: true, aspectRatio: 2,
          plugins: {
            legend: { position: 'top', labels: { font: { size: 18 } } },
            datalabels: { display: ctx => ctx.dataset.type !== 'line' || ctx.dataset.label === '总分' }
          },
          scales: {
            y: { min: yMin, max: yMax, title: { display: true, text: '语数外均分', font: { size: 18 } }, ticks: { font: { size: 16 } }, grid: { color: '#e8e6dc' } },
            y1: { min: y1Min, max: y1Max, position: 'right', ticks: { display: false }, grid: { display: false } },
            x: { ticks: { font: { size: 16 } }, grid: { display: false } }
          }
        }
      });
    }

    // Chart 2: Other subjects
    const otherKeys = subjKeys.filter(k => !['yw','sx','yy','total'].includes(k));
    if (otherKeys.length > 0) {
      const cvs2 = createOffscreenCanvas(`chart_pct_2_${cate}`);
      if (cvs2) {
        destroyChart(`pct_2_${cate}`);
        let otherMin = Infinity, otherMax = -Infinity;
        for (let sk of otherKeys) {
          for (let s of validSchools) {
            const v = pctData[s]?.[sk] || 0;
            if (v < otherMin) otherMin = v;
            if (v > otherMax) otherMax = v;
          }
        }
        const otherMargin = Math.max(5, (otherMax - otherMin) * 0.15);
        const otherYMin = Math.max(0, otherMin - otherMargin);
        const otherDatasets = otherKeys.map((sk, si) => ({
          label: keyToName(sk),
          data: validSchools.map(s => pctData[s]?.[sk] || 0),
          backgroundColor: getSubjectColor(sk),
          borderRadius: 4,
          datalabels: { anchor: 'end', align: 'end', offset: 20, color: '#333', font: { weight: 'bold', size: 15 }, formatter: v => v>0?v.toFixed(1):'' }
        }));
        chartInstances[`pct_2_${cate}`] = new Chart(cvs2, {
          type: 'bar', data: { labels: validSchools, datasets: otherDatasets },
            options: {
            responsive: true, maintainAspectRatio: true, aspectRatio: 2,
            plugins: { legend: { position: 'top', labels: { font: { size: 18 } } } },
            scales: { y: { min: otherYMin, title: { display: true, text: '均分', font: { size: 18 } }, ticks: { font: { size: 16 } }, grid: { color: '#e8e6dc' } }, x: { ticks: { font: { size: 16 } }, grid: { display: false } } }
          }
        });
      }
    }
  }

  // Render elite charts for ALL categories
  for (let cate of cats) {
    const result = getResult(cate);
    if (!result || result.error) continue;
    const { validSchools, eliteData, eliteThresholds } = result;
    if (!eliteData || !eliteThresholds || eliteThresholds.length === 0) continue;

    const cvsElite = createOffscreenCanvas(`chart_elite_${cate}`);
    if (cvsElite) {
      destroyChart(`elite_${cate}`);
      const tColors = ['#d97757','#6a9bcc','#788c5d','#8b6faf','#c47f5a'];
      const eliteDatasets = eliteThresholds.map((t, ti) => ({
        label: '前' + t + '名',
        data: validSchools.map(s => {
          const ed = eliteData[t];
          return ed.total > 0 ? (ed.counts[s] || 0) / ed.total * 100 : 0;
        }),
        backgroundColor: tColors[ti % tColors.length] + 'bb',
        borderColor: tColors[ti % tColors.length], borderWidth: 2, borderRadius: 3,
        datalabels: { anchor: 'end', align: 'end', offset: 12, color: '#333', font: { weight: 'bold', size: 15 }, formatter: v => v.toFixed(1) + '%' }
      }));
      chartInstances[`elite_${cate}`] = new Chart(cvsElite, {
        type: 'bar', data: { labels: validSchools, datasets: eliteDatasets },
        options: {
          responsive: true, maintainAspectRatio: true, aspectRatio: 2,
          plugins: { legend: { position: 'top', labels: { font: { size: 18 } } } },
          scales: {
            y: { beginAtZero: true, max: 100, title: { display: true, text: '占比 (%)', font: { size: 18 } }, ticks: { font: { size: 16 }, callback: v => v + '%' }, grid: { color: '#e8e6dc' } },
            x: { ticks: { font: { size: 16 } }, grid: { display: false } }
          }
        }
      });
    }
  }

  // Async: wait for all charts to render, then resize & export
  setTimeout(() => {
    void document.body.offsetHeight;
    Object.keys(chartInstances).forEach(k => {
      try { chartInstances[k].resize(); } catch(e) {}
    });

    const schools = window._selectedSchools || [];

  // ================================================================
  // SECTION 1: 联考概览
  // ================================================================
  for (let cate of cats) {
    const sfx = `01_联考概览/${cate}`;
    const cateRows = (window._filteredRaw || []).filter(r => (r.category || '').includes(cate) || r.category === cate);

    // Batch cutoff table
    const cateBatchLines = (window._batchLines[cate] || {});
    const batchNames = Object.keys(cateBatchLines);
    if (batchNames.length) {
      const subjAll = getSubjKeys(cate);
      const bHeaders = ['批次', '总分线', ...subjAll.map(keyToName)];
      const bColW = [22, 14, ...subjAll.map(() => 16)];
      const bRows = batchNames.map(b => {
        const line = cateBatchLines[b];
        return [b, line.total > 0 ? line.total : '-', ...subjAll.map(k => line[k] > 0 ? line[k] : '-')];
      });
      addTable(bHeaders, bRows, bColW, sfx, '批次划线');
    }

    // School overview table
    const schHeaders = ['学校', '参考人数', '总分均分', '最高分'];
    const schColW = [46, 22, 22, 22];
    const schRows = schools.map(s => {
      const sr = cateRows.filter(r => r.school === s);
      const st = sr.map(r => r.total).filter(t => t > 0);
      return [s, sr.length,
        st.length ? (st.reduce((a, b) => a + b, 0) / st.length).toFixed(1) : '-',
        st.length ? Math.max(...st).toFixed(0) : '-'
      ];
    });
    schRows.sort((a, b) => parseFloat(b[2] || 0) - parseFloat(a[2] || 0));
    addTable(schHeaders, schRows, schColW, sfx, '各校核心数据');
  }

  // ================================================================
  // SECTION 2: 各校上线对比
  // ================================================================
  for (let cate of cats) {
    const sfx = `02_各校上线对比/${cate}`;
    addChart(`cutoff_count_${cate}`, sfx, '各批次上线人数');
    addChart(`cutoff_rate_${cate}`, sfx, '各批次上线率');

    const result = getResult(cate);
    if (result && !result.error) {
      const { validSchools, cutoffData } = result;
      const batchNames = Object.keys(window._batchLines[cate] || {});
      const cbHeaders = ['学校', '参考人数'];
      for (let b of batchNames) cbHeaders.push(b + '人数', b + '率');
      const cbColW = [30, 14, ...batchNames.flatMap(() => [16, 16])];
      const cbRows = validSchools.map(s => {
        const entry = cutoffData[s];
        const row = [s, entry ? entry.refCount : 0];
        for (let b of batchNames) {
          const d = entry ? entry.batches[b] : null;
          row.push(d ? d.totalPass : 0, d ? (d.totalRate * 100).toFixed(1) + '%' : '0.0%');
        }
        return row;
      });
      addTable(cbHeaders, cbRows, cbColW, sfx, '上线数据明细', 11);
    }
  }

  // ================================================================
  // SECTION 3: 尖子生排名
  // ================================================================
  for (let cate of cats) {
    const sfx = `03_尖子生排名/${cate}`;
    const cateRows = (window._filteredRaw || []).filter(r => (r.category || '').includes(cate) || r.category === cate);
    const topN = cate === '物理' ? 30 : 10;
    const rankRows = [...cateRows].sort((a, b) => b.total - a.total).slice(0, topN);
    const subjKeys = getSubjKeys(cate);
    const rkHeaders = ['排名', '学校', ...subjKeys.map(keyToName), '总分'];
    const rkColW = [10, 30, ...subjKeys.map(() => 16), 18];

    const buildRankRows = (from, to) => rankRows.slice(from, to).map((r, i) => [
      from + i + 1, r.school,
      ...subjKeys.map(k => r.scores[k] > 0 ? r.scores[k].toFixed(0) : '-'),
      r.total.toFixed(0)
    ]);

    if (rankRows.length <= 15) {
      addTable(rkHeaders, buildRankRows(0, rankRows.length), rkColW, sfx, `前${topN}名成绩排名`, 11);
    } else {
      addTable(rkHeaders, buildRankRows(0, 15), rkColW, sfx, `前${topN}名-第1-15名`, 11);
      addTable(rkHeaders, buildRankRows(15, rankRows.length), rkColW, sfx, `前${topN}名-第16-${rankRows.length}名`, 11);
    }
  }

  // ================================================================
  // SECTION 4: 尖子生分层均分对比
  // ================================================================
  for (let cate of cats) {
    const sfx = `04_尖子生分层均分对比/${cate}`;
    const topLabels = ['前30名', '前100名', '前200名'];
    for (let ci = 0; ci < 3; ci++) {
      addChart(`top1_${cate}_${ci}`, sfx, `${topLabels[ci]}-语数外+总分`);
      addChart(`top2_${cate}_${ci}`, sfx, `${topLabels[ci]}-其他学科均分`);
    }
    addChart(`trend_${cate}`, sfx, '跨层级总分均分趋势');

    const result = getResult(cate);
    if (result && !result.error) {
      const td = result.topData && result.topData.top30 ? result.topData.top30.data : {};
      const tHeaders = ['学校', '总分', ...result.subjKeys.map(keyToName)];
      const tColW = [32, 14, ...result.subjKeys.map(() => 14)];
      const tRows = result.validSchools.map(s => {
        const d = td[s] || {};
        return [s, (d.total || 0).toFixed(1), ...result.subjKeys.map(k => d[k] > 0 ? d[k].toFixed(1) : '-')];
      });
      addTable(tHeaders, tRows, tColW, sfx, '前30名各校均分明细', 11);
    }
  }

  // ================================================================
  // SECTION 5: 前30%均分对比
  // ================================================================
  for (let cate of cats) {
    const sfx = `05_前30%均分对比/${cate}`;
    addChart(`pct_1_${cate}`, sfx, '语数外均分+总分');
    addChart(`pct_2_${cate}`, sfx, '其他学科均分');

    const result = getResult(cate);
    if (result && !result.error) {
      const pd = result.pctData || {};
      const pHdrs = ['学校', '总分', ...result.subjKeys.map(keyToName)];
      const pColW = [30, 14, ...result.subjKeys.map(() => 14)];
      const pRows = [...result.validSchools].sort((a, b) => (pd[b]?.total || 0) - (pd[a]?.total || 0)).map(s => {
        const d = pd[s] || {};
        return [s, (d.total || 0).toFixed(1), ...result.subjKeys.map(k => d[k] > 0 ? d[k].toFixed(1) : '-')];
      });
      addTable(pHdrs, pRows, pColW, sfx, `前${result.pct}%各校均分明细`, 11);
    }
  }

  // ================================================================
  // SECTION 6: 优秀生分布
  // ================================================================
  for (let cate of cats) {
    const sfx = `06_优秀生分布/${cate}`;
    addChart(`elite_${cate}`, sfx, '各校优秀生分布对比');

    const result = getResult(cate);
    if (result && !result.error) {
      const eHdrs = ['学校'];
      for (let t of result.eliteThresholds) eHdrs.push('前' + t + '名人数', '前' + t + '名占比');
      const eColW = [30];
      for (let i = 0; i < result.eliteThresholds.length; i++) eColW.push(16, 16);
      const eRows = result.validSchools.map(s => {
        const row = [s];
        for (let t of result.eliteThresholds) {
          const ed = result.eliteData[t];
          const cnt = ed.counts[s] || 0;
          const pct = ed.total > 0 ? (cnt / ed.total * 100).toFixed(1) + '%' : '0.0%';
          row.push(cnt, pct);
        }
        return row;
      });
      addTable(eHdrs, eRows, eColW, sfx, '优秀生各校人数及占比明细', 11);
    }
  }

  // ================================================================
  // SECTION 7: 学科贡献度
  // ================================================================
  for (let cate of cats) {
    const result = getResult(cate);
    if (result && !result.error && result.contribResult) {
      const cr = result.contribResult;
      if (cr.schools) {
        const subjKeys = result.subjKeys || [];
        const validSchools = result.validSchools || [];
        const schoolsWithData = validSchools.filter(s => cr.schools[s] && Object.keys(cr.schools[s]).length > 0);
      for (let si = 0; si < schoolsWithData.length; si++) {
          const s = schoolsWithData[si];
          const sfx = `07_学科贡献度/${cate}/${s}`;
          addChart(`contrib_${cate}_${si}`, sfx, '气泡图');
          const cs = cr.schools[s] || {};
          const cHdrs = ['学科', '双上线', '贡献率', '命中率', '参考人数', '等级'];
          const cColW = [22, 14, 14, 14, 16, 12];
          const cRows = subjKeys.map(sk => {
            const d = cs[sk];
            if (!d || d.refCount === 0) return null;
            return [keyToName(sk), d.doublePass, d.contribRate + '%', d.hitRate + '%', d.refCount, d.grade];
          }).filter(r => r !== null);
          addTable(cHdrs, cRows, cColW, sfx, '贡献度明细', 11);
        }
      }
    }
  }

  // ================================================================
  // DOWNLOAD ZIP
  // ================================================================
  const fileName = `${examName}_分析图表.zip`;
  zip.generateAsync({ type: 'blob' }).then(content => {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(content);
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(link.href), 10000);
    offscreenCanvases.forEach(c => c.remove());
    btn.disabled = false;
    btn.textContent = '📦 导出图表';
  }).catch(err => {
    console.error('ZIP error:', err);
    alert('导出失败，请重试');
    offscreenCanvases.forEach(c => c.remove());
    btn.disabled = false;
    btn.textContent = '📦 导出图表';
  });
  }, 400);
}

// =============================================================
// MSG HELPER
// =============================================================
function showMsg(id, text, type) {
  const el = document.getElementById(id);
  if (!el) return;
  if (!text) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="msg msg-${type || 'info'}">${text}</div>`;
}

// =============================================================
// FILE UPLOAD HANDLING
// =============================================================
document.addEventListener('DOMContentLoaded', function() {
  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');

  if (!uploadZone || !fileInput) {
    console.error('Upload zone or file input not found!');
    return;
  }

  uploadZone.addEventListener('click', () => fileInput.click());

  uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadZone.classList.add('drag-over');
  });
  uploadZone.addEventListener('dragleave', () => {
    uploadZone.classList.remove('drag-over');
  });
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    if (e.dataTransfer.files.length > 0) {
      handleFile(e.dataTransfer.files[0]);
    }
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) handleFile(e.target.files[0]);
  });
});

function handleFile(file) {
  const fileName = document.getElementById('fileName');
  fileName.textContent = `📄 ${file.name}`;

  document.getElementById('loadingOverlay').classList.add('active');

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const parsed = parseExcel(data);
      rawData = parsed;

      document.getElementById('uploadPreview').style.display = 'block';
      document.getElementById('previewInfo').innerHTML =
        `检测到 <strong>${parsed.rows.length}</strong> 条记录，<strong>${parsed.schools.length}</strong> 所学校 (${parsed.schools.join(', ')})`;

      // Populate school checkboxes
      const checkboxContainer = document.getElementById('schoolCheckboxes');
      checkboxContainer.innerHTML = parsed.schools.map(s =>
        `<label><input type="checkbox" value="${s}" checked> ${s}</label>`
      ).join('');

      // Populate batch cutoff table
      populateBatchTable(parsed);

      // Show config
      document.getElementById('config-section').style.display = 'block';
      document.getElementById('config-section').scrollIntoView({ behavior: 'smooth' });
      document.getElementById('uploadMsg').innerHTML = '';

      showMsg('uploadMsg', `✅ 成功读取 ${parsed.rows.length} 条记录，${parsed.schools.length} 所学校`, 'success');

    } catch (err) {
      showMsg('uploadMsg', `❌ ${err.message}`, 'error');
      console.error(err);
    }
    document.getElementById('loadingOverlay').classList.remove('active');
  };
  reader.readAsArrayBuffer(file);
}

// =============================================================
// DEMO DATA
// =============================================================
function loadDemoData() {
  document.getElementById('loadingOverlay').classList.add('active');

  const schoolNames = ['AA市第一中学', 'BB市第二中学', 'CC市第三中学', 'DD市第四中学', 'EE市第五中学'];
  const categories = ['物理', '历史'];

  function gaussRandom(mean, std) {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    const z = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
    return Math.max(0, Math.min(100, mean + std * z));
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, Math.round(v))); }

  function genStudent(school, cate, idx) {
    const isPhysics = cate === '物理';
    const schoolIdx = schoolNames.indexOf(school);
    const schoolBonus = [1.08, 1.04, 1.0, 0.95, 0.92][schoolIdx] || 1.0;

    // Elite student injection: top schools get more elite students
    const eliteChance = [0.035, 0.02, 0.012, 0.008, 0.005][schoolIdx] || 0.01;
    const isElite = Math.random() < eliteChance;
    const isHigh = !isElite && Math.random() < eliteChance * 3;

    let yw, sx, yy, wl, ls, hx, sw, zz, dl;

    if (isElite) {
      // 超一流 level: total ~670-720
      yw = clamp(gaussRandom(133 * schoolBonus, 5), 125, 145);
      sx = clamp(gaussRandom((isPhysics ? 138 : 128) * schoolBonus, 8), 120, 150);
      yy = clamp(gaussRandom(134 * schoolBonus, 6), 125, 148);
    } else if (isHigh) {
      // 600分+ level: total ~605-665
      yw = clamp(gaussRandom(122 * schoolBonus, 6), 112, 142);
      sx = clamp(gaussRandom((isPhysics ? 122 : 114) * schoolBonus, 10), 105, 148);
      yy = clamp(gaussRandom(124 * schoolBonus, 7), 115, 145);
    } else {
      // Normal students
      yw = clamp(gaussRandom(105 * schoolBonus, 12), 60, 145);
      sx = clamp(gaussRandom((isPhysics ? 102 : 95) * schoolBonus, 18), 30, 150);
      yy = clamp(gaussRandom(108 * schoolBonus, 14), 50, 148);
    }

    if (isPhysics) {
      if (isElite) {
        wl = clamp(gaussRandom(95 * schoolBonus, 4), 90, 100);
        hx = clamp(gaussRandom(94 * schoolBonus, 4), 88, 100);
      } else if (isHigh) {
        wl = clamp(gaussRandom(87 * schoolBonus, 6), 78, 100);
        hx = clamp(gaussRandom(88 * schoolBonus, 5), 80, 100);
      } else {
        wl = clamp(gaussRandom(72 * schoolBonus, 14), 20, 100);
        hx = clamp(gaussRandom(78 * schoolBonus, 12), 25, 100);
      }
      const choice = idx % 3;
      if (choice === 0) {
        sw = clamp(gaussRandom((isElite ? 92 : isHigh ? 84 : 80) * schoolBonus, isElite ? 4 : 12), 30, 100);
        zz = 0; dl = 0;
      } else if (choice === 1) {
        zz = clamp(gaussRandom((isElite ? 90 : isHigh ? 81 : 75) * schoolBonus, isElite ? 4 : 11), 30, 100);
        sw = 0; dl = 0;
      } else {
        dl = clamp(gaussRandom((isElite ? 91 : isHigh ? 83 : 78) * schoolBonus, isElite ? 4 : 12), 30, 100);
        sw = 0; zz = 0;
      }
    } else {
      if (isElite) {
        ls = clamp(gaussRandom(90 * schoolBonus, 4), 85, 100);
      } else if (isHigh) {
        ls = clamp(gaussRandom(83 * schoolBonus, 5), 76, 100);
      } else {
        ls = clamp(gaussRandom(75 * schoolBonus, 12), 25, 100);
      }
      zz = clamp(gaussRandom((isElite ? 88 : isHigh ? 79 : 72) * schoolBonus, isElite ? 4 : 11), 25, 100);
      dl = clamp(gaussRandom((isElite ? 89 : isHigh ? 80 : 74) * schoolBonus, isElite ? 4 : 11), 25, 100);
      wl = 0; hx = 0; sw = 0;
    }

    // Get subject scores (赋分)
    const sList = [yw, sx, yy, wl || 0, ls || 0, hx || 0, sw || 0, zz || 0, dl || 0];
    const total = Math.round(sList.reduce((a, b) => a + b, 0));

    return {
      school,
      category: cate,
      total,
      rank: 0,
      scores: {
        yw, sx, yy,
        wl: wl || 0, ls: ls || 0,
        hx: hx || 0, sw: sw || 0,
        zz: zz || 0, dl: dl || 0,
      },
      _row: 0,
    };
  }

  // Generate students
  let rows = [];
  const counts = { 'AA市第一中学': { '物理': 420, '历史': 180 },
    'BB市第二中学': { '物理': 650, '历史': 350 },
    'CC市第三中学': { '物理': 480, '历史': 220 },
    'DD市第四中学': { '物理': 380, '历史': 160 },
    'EE市第五中学': { '物理': 520, '历史': 280 } };

  let rowNum = 2;
  for (let school of schoolNames) {
    for (let cate of categories) {
      const n = counts[school][cate];
      for (let i = 0; i < n; i++) {
        const r = genStudent(school, cate, i);
        r._row = rowNum++;
        rows.push(r);
      }
    }
  }

  // Assign ranks within each category
  for (let cate of categories) {
    const cateRows = rows.filter(r => r.category === cate);
    cateRows.sort((a, b) => b.total - a.total);
    cateRows.forEach((r, i) => r.rank = i + 1);
  }

  rawData = {
    rows,
    schools: schoolNames,
    colHeaders: ['学校','科类','总分','语文','数学','英语','物理','历史','化学','生物','政治','地理'],
    col: { school:'学校', category:'科类', total:'总分', yw:'语文', sx:'数学', yy:'英语', wl:'物理', ls:'历史', hx:'化学', sw:'生物', zz:'政治', dl:'地理' },
  };

  document.getElementById('fileName').textContent = '📊 示例数据（5校 · 物理+历史）';
  document.getElementById('uploadPreview').style.display = 'block';
  document.getElementById('previewInfo').innerHTML =
    `生成 <strong>${rows.length}</strong> 条模拟记录，<strong>${schoolNames.length}</strong> 所学校 (${schoolNames.join(', ')})`;

  const checkboxContainer = document.getElementById('schoolCheckboxes');
  checkboxContainer.innerHTML = schoolNames.map(s =>
    `<label><input type="checkbox" value="${s}" checked> ${s}</label>`
  ).join('');

  document.getElementById('examName').value = '2025年春季五校联考质量分析（模拟数据）';
  populateBatchTable(rawData);
  document.getElementById('config-section').style.display = 'block';
  document.getElementById('config-section').scrollIntoView({ behavior: 'smooth' });
  document.getElementById('uploadMsg').innerHTML = '';
  showMsg('uploadMsg', `✅ 已生成 ${rows.length} 条模拟数据，${schoolNames.length} 所学校`, 'success');
  document.getElementById('loadingOverlay').classList.remove('active');
}

function populateBatchTable(parsed) {
  const subjKeys = ['yw','sx','yy','wl','ls','hx','sw','zz','dl'];
  const subjLabels = ['总分','语文','数学','英语','物理','历史','化学','生物','政治','地理'];

  // Get max scores for hints
  const maxScores = { total: 750 };
  for (let sk of subjKeys) {
    const vals = parsed.rows.map(r => r.scores[sk] || 0).filter(v => v > 0);
    maxScores[sk] = vals.length > 0 ? Math.max(...vals) : 100;
  }

  const defaults = {
    '物理': {
      '超一流': { total: 666, yw: 127, sx: 137, yy: 143, wl: 88, hx: 100, sw: 99, zz: 0, dl: 0 },
      '600分': { total: 600, yw: 118, sx: 115, yy: 135.5, wl: 72, hx: 95, sw: 94, zz: 0, dl: 0 },
      '双一流': { total: 569, yw: 114, sx: 102, yy: 129.5, wl: 64, hx: 92, sw: 91, zz: 97, dl: 100 },
      '一本线': { total: 440, yw: 99, sx: 54, yy: 95.5, wl: 32, hx: 74, sw: 75, zz: 83, dl: 84 },
    },
    '历史': {
      '超一流': { total: 606, yw: 126, sx: 116, yy: 142, ls: 85, zz: 100, dl: 100, wl: 0, hx: 0, sw: 0 },
      '600分': { total: 600, yw: 124, sx: 106, yy: 138, ls: 84, zz: 98, dl: 96, wl: 0, hx: 0, sw: 0 },
      '双一流': { total: 557, yw: 116, sx: 78, yy: 128, ls: 78, zz: 93, dl: 92, wl: 0, hx: 0, sw: 0 },
      '一本线': { total: 482, yw: 105, sx: 43, yy: 105, ls: 66, zz: 81, dl: 80, wl: 0, hx: 0, sw: 0 },
    }
  };

  for (let cate of ['物理', '历史']) {
    const tbody = document.getElementById(`batchTableBody_${cate}`);
    tbody.innerHTML = '';
    const cateDefaults = defaults[cate] || {};
    for (let batch of BATCH_NAMES) {
      const d = cateDefaults[batch] || {};
      const tr = document.createElement('tr');
      tr.dataset.batch = batch;
      let html = `<td class="sticky-col"><strong>${batch}</strong></td>`;
      const allKeys = ['total', ...subjKeys];
      for (let k of allKeys) {
        const val = d[k] || '';
        const hint = '';
        html += `<td><input type="number" step="any" value="${val}" placeholder="" min="0"></td>`;
      }
      tr.innerHTML = html;
      tbody.appendChild(tr);
    }
  }
}

function switchBatchCate(cate) {
  document.querySelectorAll('#batchCateTabs .sub-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.cate === cate);
  });
  document.getElementById('batchTableBody_物理').style.display = cate === '物理' ? '' : 'none';
  document.getElementById('batchTableBody_历史').style.display = cate === '历史' ? '' : 'none';
}

// Header auto-hide on scroll past hero
document.addEventListener('DOMContentLoaded', function() {
  const header = document.querySelector('.app-header');
  const configSection = document.getElementById('config-section');
  if (header && configSection) {
    let hidden = false;
    const check = () => {
      if (configSection.style.display === 'none') return;
      const rect = configSection.getBoundingClientRect();
      if (rect.top < 80 && !hidden) {
        header.classList.add('hidden');
        hidden = true;
      } else if (rect.top >= 80 && hidden) {
        header.classList.remove('hidden');
        hidden = false;
      }
    };
    window.addEventListener('scroll', check, { passive: true });
    check();
  }
});
