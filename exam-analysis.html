<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校级联考质量分析报告</title>
<!-- CDN Libraries -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
/* ============================================
   RESET & BASE
   ============================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Poppins', Lora, Georgia, 'Noto Sans SC', -apple-system, sans-serif;
  background: #faf9f5;
  color: #141413;
  font-size: 18px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ============================================
   ANTHROPIC BRAND COLORS
   ============================================ */
:root {
  --color-dark: #141413;
  --color-light: #faf9f5;
  --color-mid-gray: #b0aea5;
  --color-light-gray: #e8e6dc;
  --color-orange: #d97757;
  --color-blue: #6a9bcc;
  --color-green: #788c5d;
  --color-purple: #8b6faf;
  --color-brown: #c47f5a;
  --color-teal: #5a8f7b;
  --color-red-light: #e8a098;
  --color-border: #d4d2c8;
  --shadow-card: 0 2px 12px rgba(20,20,19,0.08);
  --radius-card: 12px;
}

/* ============================================
   TYPOGRAPHY
   ============================================ */
h1, h2, h3, h4 { font-family: 'Poppins', Arial, sans-serif; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
h1 { font-size: 32px; }
h2 { font-size: 26px; }
h3 { font-size: 22px; }
h4 { font-size: 18px; font-weight: 500; }
p, li, td, th, label, input, button, select, textarea, span, div { font-size: 18px; }
small { font-size: 14px; color: var(--color-mid-gray); }

/* ============================================
   LAYOUT
   ============================================ */
.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ============================================
   HEADER
   ============================================ */
.app-header {
  background: var(--color-dark);
  color: var(--color-light);
  padding: 32px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  transition: transform 0.35s ease, opacity 0.35s ease;
}
.app-header.hidden {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}
.app-header .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}
.app-header h1 { font-size: 28px; color: var(--color-light); }
.header-meta { color: var(--color-mid-gray); font-size: 16px; }
.header-actions { display: flex; gap: 12px; flex-wrap: wrap; }

/* ============================================
   BUTTONS
   ============================================ */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 28px; border: none; border-radius: 8px;
  font-size: 18px; font-weight: 500; cursor: pointer;
  transition: all 0.2s; text-decoration: none;
}
.btn-primary { background: var(--color-orange); color: #fff; }
.btn-primary:hover { background: #c96a4a; }
.btn-secondary { background: var(--color-blue); color: #fff; }
.btn-secondary:hover { background: #5a8ab8; }
.btn-outline { background: transparent; border: 2px solid var(--color-mid-gray); color: var(--color-dark); }
.btn-outline:hover { border-color: var(--color-dark); }
.btn-dark { background: var(--color-dark); color: var(--color-light); }
.btn-dark:hover { background: #2a2a28; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ============================================
   UPLOAD SECTION
   ============================================ */
.section-card {
  background: #fff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: 32px;
  margin-bottom: 32px;
  box-shadow: var(--shadow-card);
}
.section-card h2 {
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--color-light-gray);
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-card h2 .step-num {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--color-orange);
  color: #fff;
  font-size: 18px;
  font-weight: 700;
}

.upload-zone {
  border: 3px dashed var(--color-border);
  border-radius: 12px;
  padding: 60px 40px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  background: var(--color-light);
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--color-orange);
  background: #fdf6f0;
}
.upload-zone .icon { font-size: 48px; margin-bottom: 16px; }
.upload-zone p { color: var(--color-mid-gray); margin-bottom: 8px; }
.upload-zone .file-name { color: var(--color-green); font-weight: 500; margin-top: 12px; }
.upload-zone input[type="file"] { display: none; }

/* ============================================
   CONFIG FORM
   ============================================ */
.config-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
@media (max-width: 800px) {
  .config-grid { grid-template-columns: 1fr; }
}

.config-group { margin-bottom: 16px; }
.config-group label {
  display: block;
  font-weight: 500;
  margin-bottom: 8px;
  color: var(--color-dark);
}
.config-group .hint {
  font-size: 14px;
  color: var(--color-mid-gray);
  margin-bottom: 6px;
}

.school-checkboxes {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.school-checkboxes label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border: 1px solid var(--color-border);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 400;
}
.school-checkboxes label:hover {
  border-color: var(--color-blue);
  background: #f0f5fa;
}
.school-checkboxes input[type="checkbox"] {
  width: 20px; height: 20px;
  accent-color: var(--color-orange);
}

.batch-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 16px;
}
.batch-table th, .batch-table td {
  border: 1px solid var(--color-border);
  padding: 8px 12px;
  text-align: center;
}
.batch-table th {
  background: var(--color-dark);
  color: var(--color-light);
  font-weight: 500;
  white-space: nowrap;
}
.batch-table th.sticky-col {
  position: sticky;
  left: 0;
  z-index: 2;
}
.batch-table td.sticky-col {
  position: sticky;
  left: 0;
  background: #fff;
  font-weight: 500;
  z-index: 1;
}
.batch-table input {
  width: 72px;
  padding: 6px 8px;
  border: 1px solid var(--color-border);
  border-radius: 4px;
  text-align: center;
  font-size: 16px;
}
.batch-table input:focus {
  outline: 2px solid var(--color-blue);
  border-color: transparent;
}
.batch-table-wrap {
  max-width: 100%;
  overflow-x: auto;
}

/* ============================================
   ANALYSIS SECTIONS
   ============================================ */
.analysis-section {
  margin-bottom: 40px;
  page-break-before: always;
}
.analysis-section:first-of-type {
  page-break-before: auto;
}

/* ============================================
   OVERVIEW CARDS
   ============================================ */
.overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.overview-card {
  background: #fff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: 20px 16px;
  text-align: center;
  box-shadow: var(--shadow-card);
}
.overview-card .oc-label {
  font-size: 14px;
  color: var(--color-mid-gray);
  margin-bottom: 6px;
  font-weight: 500;
}
.overview-card .oc-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--color-dark);
  line-height: 1.2;
}
.overview-card .oc-sub {
  font-size: 14px;
  color: var(--color-mid-gray);
  margin-top: 4px;
}
.overview-card.oc-accent {
  border-color: var(--color-orange);
}
.overview-card.oc-accent .oc-value {
  color: var(--color-orange);
}
.overview-subsection {
  margin-bottom: 24px;
}
.overview-subsection h3 {
  font-size: 20px;
  margin-bottom: 12px;
  color: var(--color-dark);
  border-bottom: 1px solid var(--color-light-gray);
  padding-bottom: 8px;
}
.overview-subsection h3 small {
  font-size: 15px;
  color: var(--color-mid-gray);
  font-weight: 400;
}

.section-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.section-header h2 {
  font-size: 26px;
  color: var(--color-dark);
  border-bottom: 2px solid var(--color-orange);
  padding-bottom: 12px;
  margin-bottom: 0;
  flex-shrink: 0;
}
.section-header .desc {
  color: var(--color-mid-gray);
  margin-top: 4px;
}
.section-header .inline-cate-tabs {
  flex-shrink: 0;
  margin-left: auto;
}

.chart-container {
  width: 100%;
  background: #fff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: 24px;
  margin-bottom: 24px;
  position: relative;
}
.chart-container .chart-title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--color-dark);
}
.chart-container canvas {
  width: 100% !important;
  max-height: 500px;
}

.table-container {
  width: 100%;
  background: #fff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: 24px;
  margin-bottom: 24px;
  overflow-x: auto;
}
.table-container .table-title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--color-dark);
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 600px;
}
.data-table th {
  background: var(--color-dark);
  color: var(--color-light);
  padding: 12px 16px;
  text-align: center;
  font-weight: 500;
  white-space: nowrap;
  font-size: 16px;
}
.data-table th:first-child {
  border-radius: 6px 0 0 0;
}
.data-table th:last-child {
  border-radius: 0 6px 0 0;
}
.data-table td {
  padding: 10px 16px;
  text-align: center;
  border-bottom: 1px solid var(--color-light-gray);
  font-size: 16px;
}
.data-table tr:last-child td {
  border-bottom: none;
}
.data-table tr:hover td {
  background: #f5f4f0;
}
.data-table td:first-child {
  font-weight: 500;
  text-align: left;
}
.data-table .highlight-row td {
  background: #fdf6f0 !important;
  font-weight: 600;
}

/* Scrollable ranking table */
.rank-table-wrap {
  max-height: 650px;
  overflow-y: auto;
  overflow-x: auto;
}
.rank-table-wrap .data-table th {
  position: sticky;
  top: 0;
  background: var(--color-dark);
  z-index: 1;
}
.rank-num {
  color: var(--color-mid-gray);
  font-size: 14px;
  text-align: center;
  width: 40px;
}

/* Heatmap table */
.heatmap-cell {
  transition: opacity 0.2s;
}

/* Sub-tab navigation */
.sub-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  background: var(--color-light-gray);
  border-radius: 8px;
  padding: 4px;
  width: fit-content;
}
.sub-tab {
  padding: 8px 20px;
  border: none;
  background: transparent;
  border-radius: 6px;
  cursor: pointer;
  font-size: 18px;
  font-weight: 500;
  transition: all 0.2s;
  color: var(--color-mid-gray);
}
.sub-tab.active {
  background: #fff;
  color: var(--color-dark);
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}
.sub-tab:hover:not(.active) {
  color: var(--color-dark);
}

.sub-tab-content {
  display: none;
}
.sub-tab-content.active {
  display: block;
}

/* ============================================
   TOGGLE SECTION (科类切换)
   ============================================ */
.cate-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
  background: var(--color-light-gray);
  border-radius: 8px;
  padding: 4px;
  width: fit-content;
}
.cate-tab {
  padding: 10px 32px;
  border: none;
  background: transparent;
  border-radius: 6px;
  cursor: pointer;
  font-size: 18px;
  font-weight: 500;
  transition: all 0.2s;
  color: var(--color-mid-gray);
}
.cate-tab.active {
  background: var(--color-dark);
  color: var(--color-light);
  box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}
.cate-tab:hover:not(.active) {
  color: var(--color-dark);
}

/* ============================================
   PDF EXPORT PAGINATION
   ============================================ */
@media print {
  body { background: #fff; font-size: 14px; }
  .app-header { position: static; }
  .section-card { box-shadow: none; break-inside: avoid; }
  .analysis-section { page-break-before: always; }
  .analysis-section:first-of-type { page-break-before: auto; }
  .chart-container, .table-container { break-inside: avoid; }
  .upload-zone, #config-section, .header-actions .btn { display: none !important; }
  .app-header h1 { font-size: 22px; }
  .container { max-width: 100%; padding: 0 12px; }
}

/* ============================================
   LOADING
   ============================================ */
.loading-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(20,20,19,0.6);
  z-index: 999;
  align-items: center;
  justify-content: center;
}
.loading-overlay.active { display: flex; }
.loading-box {
  background: #fff;
  padding: 40px 48px;
  border-radius: 16px;
  text-align: center;
}
.spinner {
  width: 48px; height: 48px;
  border: 4px solid var(--color-light-gray);
  border-top-color: var(--color-orange);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================
   MISC
   ============================================ */
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.mb-16 { margin-bottom: 16px; }
.text-center { text-align: center; }
.gap-12 { gap: 12px; }
.flex-wrap { display: flex; flex-wrap: wrap; align-items: center; }

.section-divider {
  height: 1px;
  background: linear-gradient(to right, transparent, var(--color-border), transparent);
  margin: 40px 0;
}

/* Message area */
.msg {
  padding: 12px 20px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 16px;
}
.msg-error {
  background: #fde8e4;
  color: #b33a2a;
  border: 1px solid #f5c6bb;
}
.msg-success {
  background: #edf3e8;
  color: #4a6b3a;
  border: 1px solid #d0dec4;
}
.msg-info {
  background: #e8f0f8;
  color: #3a6090;
  border: 1px solid #c4d8ec;
}

/* Tabs inside section */
.inner-tabs {
  margin-bottom: 16px;
}

.score-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 500;
}
.score-raw { background: var(--color-light-gray); color: var(--color-mid-gray); }
.score-fu { background: #fdf6f0; color: var(--color-orange); }

/* inline flex for labels */
.batch-header {
  display: flex;
  gap: 24px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

/* Footer */
.app-footer {
  text-align: center;
  padding: 24px 0;
  color: var(--color-mid-gray);
  border-top: 1px solid var(--color-border);
  margin-top: 48px;
}
</style>
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header class="app-header">
  <div class="container">
    <div>
      <h1>校级联考质量分析</h1>
      <div class="header-meta" id="headerMeta">请上传数据文件开始分析</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" id="btnExportPDF" onclick="exportPDF()" disabled>
        📦 导出图表
      </button>
    </div>
  </div>
</header>

<!-- ==================== MAIN ==================== -->
<main class="container" style="padding-top: 32px;">

  <!-- ========== STEP 1: UPLOAD ========== -->
  <section class="section-card" id="upload-section">
    <h2><span class="step-num">1</span> 上传成绩数据</h2>
    <div class="upload-zone" id="uploadZone">
      <div class="icon">📂</div>
      <p><strong>点击上传</strong> 或将 Excel 文件拖拽到此区域</p>
      <p style="font-size:14px;">支持 .xlsx / .xls 格式（每行一名学生，含学校、科类、各科分数列）</p>
      <input type="file" id="fileInput" accept=".xlsx,.xls">
      <div class="file-name" id="fileName"></div>
    </div>
    <div class="text-center mt-24" style="padding:20px 0;">
      <button class="btn btn-secondary" onclick="loadDemoData()" style="padding:14px 36px;font-size:18px;box-shadow:0 2px 8px rgba(106,155,204,0.3);">
        🎯 暂无数据？点击加载示例数据（5校模拟）
      </button>
    </div>
    <div id="uploadMsg"></div>
    <div id="uploadPreview" style="display:none;margin-top:16px;">
      <p style="color:var(--color-green);font-weight:500;">✓ 已检测到以下数据：</p>
      <p id="previewInfo" style="margin-top:8px;font-size:16px;"></p>
    </div>
  </section>

  <!-- ========== STEP 2: CONFIG ========== -->
  <section class="section-card" id="config-section" style="display:none;">
    <h2><span class="step-num">2</span> 配置分析参数</h2>

    <div id="configMsg"></div>

    <div class="config-grid">
      <!-- Left column -->
      <div>
        <div class="config-group">
          <label>选择参与对比的学校</label>
          <div class="hint">至少选择2所学校</div>
          <div class="school-checkboxes" id="schoolCheckboxes"></div>
        </div>
        <div class="config-group">
          <label>考试名称（可选）</label>
          <input type="text" id="examName" placeholder="如：2025年二月圆创联考" style="width:100%;padding:10px 14px;border:1px solid var(--color-border);border-radius:8px;font-size:18px;">
        </div>
      </div>
      <!-- Right column -->
      <div>
        <div class="config-group">
          <label>分层参数</label>
          <div class="flex-wrap gap-12" style="margin-top:8px;">
            <label style="font-weight:400;">前 <input type="number" id="top30Count" value="30" style="width:60px;padding:6px 8px;border:1px solid var(--color-border);border-radius:4px;text-align:center;font-size:16px;"> 名</label>
            <label style="font-weight:400;">前 <input type="number" id="top100Count" value="100" style="width:60px;padding:6px 8px;border:1px solid var(--color-border);border-radius:4px;text-align:center;font-size:16px;"> 名</label>
            <label style="font-weight:400;">前 <input type="number" id="top200Count" value="200" style="width:60px;padding:6px 8px;border:1px solid var(--color-border);border-radius:4px;text-align:center;font-size:16px;"> 名</label>
            <label style="font-weight:400;">前 <input type="number" id="topPct" value="30" style="width:60px;padding:6px 8px;border:1px solid var(--color-border);border-radius:4px;text-align:center;font-size:16px;"> %</label>
          </div>
        </div>
      </div>
    </div>

    <!-- Batch cutoffs -->
    <div class="config-group" style="margin-top:8px;">
      <label>批次划线标准</label>
      <div class="hint">物理类和历史类分别填写各自的划线。总分线和各科单科线均需填写。</div>
      <div class="sub-tabs" style="margin-bottom:12px;" id="batchCateTabs">
        <button class="sub-tab active" data-cate="物理" onclick="switchBatchCate('物理')">物理类</button>
        <button class="sub-tab" data-cate="历史" onclick="switchBatchCate('历史')">历史类</button>
      </div>
      <div class="batch-table-wrap">
        <table class="batch-table" id="batchTable">
          <thead>
            <tr>
              <th class="sticky-col">批次</th>
              <th>总分</th>
              <th>语文</th>
              <th>数学</th>
              <th>英语</th>
              <th>物理</th>
              <th>历史</th>
              <th>化学</th>
              <th>生物</th>
              <th>政治</th>
              <th>地理</th>
            </tr>
          </thead>
          <tbody id="batchTableBody_物理"></tbody>
          <tbody id="batchTableBody_历史" style="display:none;"></tbody>
        </table>
      </div>
    </div>

    <div class="mt-24 text-center">
      <button class="btn btn-primary" onclick="generateAnalysis()" id="btnGenerate" style="padding:14px 48px;">
        🚀 生成分析报告
      </button>
    </div>
  </section>

  <!-- ========== STEP 3: RESULTS ========== -->
  <div id="resultsArea" style="display:none;">

    <div id="analysisContent">
      <div id="sec-overview" class="analysis-section"></div>

<script>
// =============================================================
// GLOBALS
// =============================================================
let rawData = null;       // Parsed rows from Excel
let allSchools = [];      // Unique school names
// Detect actual subjects present in data for a category
function detectSubjects(rows) {
  const allKeys = ['yw','sx','yy','wl','ls','hx','sw','zz','dl'];
  const core = ['yw','sx','yy']; // Core subjects always present
  const found = [];
  for (let k of allKeys) {
    const count = rows.filter(r => (r.scores[k] || 0) > 0).length;
    if (count >= rows.length * 0.3) found.push(k); // Subject taken by at least 30% of students
  }
  // Ensure core subjects are first and in order
  const ordered = core.filter(k => found.includes(k));
  const rest = found.filter(k => !core.includes(k));
  return [...ordered, ...rest];
}
const BATCH_NAMES = ['超一流','600分','双一流','一本线'];
// School color palette
const SCHOOL_COLORS = [
  '#6a9bcc','#d97757','#8b6faf','#788c5d','#c47f5a','#5a8f7b',
  '#b8736a','#5f9ea0','#b8865a','#7b68a0'
];

let chartInstances = {};

// =============================================================
// COLUMN DETECTION
// =============================================================
function detectColumns(headers) {
  const mapping = {};
  const rules = [
    ['学校','school'],['科类','category'],['类别','category'],
    ['语文','yw'],['数学','sx'],['英语','yy'],['外语','yy'],
    ['物理','wl'],['历史','ls'],
    ['化学','hx'],['生物','sw'],['政治','zz'],['地理','dl'],
    ['总分','total'],['排名','rank'],['名次','rank']
  ];
  for (let h of headers) {
    const hStr = String(h).trim();
    for (let [key, val] of rules) {
      if (hStr.includes(key)) { mapping[val] = hStr; break; }
    }
  }
  return mapping;
}

// =============================================================
// EXCEL PARSING
// =============================================================
function parseExcel(data) {
  const wb = XLSX.read(data, { type: 'array', codepage: 936 });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
  if (!json || json.length === 0) throw new Error('表格为空，请检查数据');

  const headers = Object.keys(json[0]);
  const col = detectColumns(headers);

  if (!col.school) throw new Error('未找到"学校"列，请确保表头包含"学校"');
  if (!col.total) throw new Error('未找到"总分"列');

  // Determine subject columns
  const subjects = [];
  for (let s of ['yw','sx','yy','wl','ls','hx','sw','zz','dl']) {
    if (col[s]) subjects.push(col[s]);
  }

  const rows = json.map((row, idx) => {
    const school = String(row[col.school] || '').trim();
    const total = parseFloat(row[col.total]) || 0;
    const category = col.category ? String(row[col.category] || '').trim() : '';
    const rank = col.rank ? parseInt(row[col.rank]) || 0 : 0;
    const scores = {};
    for (let s of ['yw','sx','yy','wl','ls','hx','sw','zz','dl']) {
      if (col[s]) scores[s] = parseFloat(row[col[s]]) || 0;
    }
    return { school, total, category, rank, scores, _row: idx+2 };
  }).filter(r => r.school && r.total > 0);

  if (rows.length === 0) throw new Error('未能解析到有效数据，请检查列名');

  // Detect unique schools & categories
  const schools = [...new Set(rows.map(r => r.school))].sort();

  return { rows, schools, colHeaders: headers, col };
}

// =============================================================
// DATA PROCESSING
// =============================================================

// Get filtered rows for a category
function getRowsByCategory(rows, cate) {
  if (cate === '综合') return rows;
  return rows.filter(r => {
    const cat = (r.category || '').trim();
    return cat === cate || cat.includes(cate);
  });
}

// Get top N students by total score
function getTopN(rows, n) {
  const sorted = [...rows].sort((a, b) => b.total - a.total);
  return sorted.slice(0, Math.min(n, sorted.length));
}

// Get top X% students
function getTopPct(rows, pct) {
  const n = Math.max(1, Math.round(rows.length * pct / 100));
  return getTopN(rows, n);
}

// Calculate average scores for a group
function calcAverages(rows) {
  if (rows.length === 0) return {};
  const sums = {};
  const counts = {};
  for (let r of rows) {
    for (let key of ['total','yw','sx','yy','wl','ls','hx','sw','zz','dl']) {
      const val = r.scores[key] || 0;
      if (val > 0) {
        sums[key] = (sums[key] || 0) + val;
        counts[key] = (counts[key] || 0) + 1;
      }
    }
    // total
    sums.total = (sums.total || 0) + r.total;
    counts.total = (counts.total || 0) + 1;
  }
  const avg = {};
  for (let key in sums) {
    avg[key] = counts[key] > 0 ? Math.round(sums[key] / counts[key] * 100) / 100 : 0;
  }
  return avg;
}

// Convert key to display name
function keyToName(key) {
  const map = { total:'总分', yw:'语文', sx:'数学', yy:'英语', wl:'物理', ls:'历史', hx:'化学', sw:'生物', zz:'政治', dl:'地理' };
  return map[key] || key;
}

// =============================================================
// CUTOFF ANALYSIS
// =============================================================
function analyzeCutoffs(rows, schools, batchLines, cate) {
  // batchLines: { '清北': { total:660, yw:130, sx:140, ... }, ... }
  const batchNames = Object.keys(batchLines);
  const result = {};

  for (let school of schools) {
    const sRows = rows.filter(r => r.school === school);
    const refCount = sRows.length;
    const entry = { refCount, batches: {} };

    for (let batch of batchNames) {
      const line = batchLines[batch];
      const totalLine = line.total || Infinity;

      // Total pass
      const totalPass = sRows.filter(r => r.total >= totalLine).length;

      // For each subject, calculate double-pass
      const subjPass = {};
      const subjRef = {};
      const subjDouble = {};

      for (let subjKey of ['yw','sx','yy','wl','ls','hx','sw','zz','dl']) {
        const subjLine = line[subjKey];
        if (!subjLine || subjLine <= 0) continue;
        const took = sRows.filter(r => (r.scores[subjKey] || 0) > 0).length;
        const subjOnly = sRows.filter(r => (r.scores[subjKey] || 0) >= subjLine).length;
        const doublePass = sRows.filter(r => r.total >= totalLine && (r.scores[subjKey] || 0) >= subjLine).length;
        subjPass[subjKey] = subjOnly;
        subjRef[subjKey] = took;
        subjDouble[subjKey] = doublePass;
      }

      entry.batches[batch] = {
        totalPass,
        totalRate: refCount > 0 ? totalPass / refCount : 0,
        subjPass,
        subjRef,
        subjDouble,
      };
    }

    result[school] = entry;
  }
  return result;
}

// =============================================================
// CONTRIBUTION ANALYSIS
// =============================================================
function analyzeContribution(rows, schools, batchLines, cate, mainBatch) {
  // Use the first batch line (usually '一本' or '高优') as the main cutoff
  const line = batchLines[mainBatch] || batchLines[Object.keys(batchLines)[0]];
  if (!line) return null;
  const totalLine = line.total || Infinity;
  const totalPassSet = new Set(rows.filter(r => r.total >= totalLine).map(r => r._row));

  const contrib = {};
  for (let school of schools) {
    const sRows = rows.filter(r => r.school === school);
    const schoolTotalPass = sRows.filter(r => totalPassSet.has(r._row)).length;
    const subjContrib = {};

    for (let subjKey of ['yw','sx','yy','wl','ls','hx','sw','zz','dl']) {
      const subjLine = line[subjKey];
      if (!subjLine || subjLine <= 0) continue;
      const refCount = sRows.filter(r => (r.scores[subjKey] || 0) > 0).length;
      const doublePass = sRows.filter(r =>
        totalPassSet.has(r._row) && (r.scores[subjKey] || 0) >= subjLine
      ).length;
      const contribRate = schoolTotalPass > 0 ? doublePass / schoolTotalPass : 0;
      const hitRate = refCount > 0 ? doublePass / refCount : 0;

      // Grade
      let grade = 'C';
      if (contribRate >= 0.8 && hitRate >= 0.9) grade = 'A3+';
      else if (contribRate >= 0.6 && hitRate >= 0.8) grade = 'A+';
      else if (contribRate >= 0.4 && hitRate >= 0.6) grade = 'A';
      else if (contribRate >= 0.2 && hitRate >= 0.4) grade = 'B';

      subjContrib[subjKey] = {
        contribRate: Math.round(contribRate * 1000) / 1000,
        hitRate: Math.round(hitRate * 1000) / 1000,
        grade,
        refCount,
        doublePass,
        totalPass: schoolTotalPass,
      };
    }
    contrib[school] = subjContrib;
  }
  return contrib;
}

// =============================================================
// COMPUTE RESULT & PER-SECTION RENDER
// =============================================================

function computeResult(cate) {
  const rows = window._filteredRaw;
  const schools = window._selectedSchools;
  const batchLines = window._batchLines[cate] || {};

  const cateRows = getRowsByCategory(rows, cate);
  const filteredSchools = schools.filter(s => cateRows.some(r => r.school === s));
  if (filteredSchools.length < 2) return { error: `"${cate}"类中选中学校不足2所` };

  const validSchools = filteredSchools.filter(s => cateRows.filter(r => r.school === s).length >= 5);
  if (validSchools.length < 2) return { error: `"${cate}"类中数据有效的学校不足2所` };

  const subjKeys = detectSubjects(cateRows);
  const subjectLabels = subjKeys.map(keyToName);

  const cutoffData = analyzeCutoffs(cateRows, validSchools, batchLines, cate);

  const topPct = parseInt(document.getElementById('topPct').value) || 30;
  const topConfigs = [
    { id: 'top30', label: '前30名', count: parseInt(document.getElementById('top30Count').value) || 30 },
    { id: 'top100', label: '前100名', count: parseInt(document.getElementById('top100Count').value) || 100 },
    { id: 'top200', label: '前200名', count: parseInt(document.getElementById('top200Count').value) || 200 },
  ];
  const topData = {};
  for (let cfg of topConfigs) {
    const data = {};
    for (let school of validSchools) {
      data[school] = calcAverages(getTopN(cateRows.filter(r => r.school === school), cfg.count));
    }
    topData[cfg.id] = { label: cfg.label, count: cfg.count, data };
  }

  const pctData = {};
  for (let school of validSchools) {
    pctData[school] = calcAverages(getTopPct(cateRows.filter(r => r.school === school), topPct));
  }

  const batchNames = Object.keys(batchLines);
  const mainBatch = batchNames[batchNames.length - 1];
  const contribResult = analyzeContribution(cateRows, validSchools, batchLines, cate, mainBatch);

  // Elite distribution data
  const eliteThresholds = [10, 20, 50, 100, 200];
  const sortedAll = [...cateRows].sort((a, b) => b.total - a.total);
  const eliteData = {};
  for (let t of eliteThresholds) {
    const topN = sortedAll.slice(0, Math.min(t, sortedAll.length));
    const counts = {};
    let total = 0;
    for (let school of validSchools) {
      const cnt = topN.filter(r => r.school === school).length;
      counts[school] = cnt;
      total += cnt;
    }
    eliteData[t] = { counts, total };
  }

  const trendLevels = topConfigs.filter(c => c.count > 0);
  const trendData = {};
  for (let school of validSchools) {
    trendData[school] = trendLevels.map(c => topData[c.id].data[school]?.total || 0);
  }

  const coreSubjKeys = ['yw','sx','yy','total'];
  const otherSubjKeys = subjKeys.filter(k => k !== 'yw' && k !== 'sx' && k !== 'yy');

  return {
    validSchools, subjKeys, subjectLabels, cutoffData, topData, pctData,
    pct: topPct, contribResult: contribResult ? { schools: contribResult } : null,
    contribMainBatch: mainBatch, eliteData, eliteThresholds,
    trendLevels: trendLevels.map(c => c.label), trendData,
    coreSubjKeys, otherSubjKeys,
  };
}

function destroyChart(key) {
  if (chartInstances[key]) { try { chartInstances[key].destroy(); } catch(e) {} delete chartInstances[key]; }
}

function destroyCharts(prefix) {
  Object.keys(chartInstances).filter(k => k.startsWith(prefix)).forEach(k => destroyChart(k));
}

function getSchoolColor(nameOrIndex) {
  if (typeof nameOrIndex === 'string') {
    const order = window._schoolOrder || [];
    const idx = order.indexOf(nameOrIndex);
    if (idx >= 0) return SCHOOL_COLORS[idx % SCHOOL_COLORS.length];
    return '#888';
  }
  return SCHOOL_COLORS[nameOrIndex % SCHOOL_COLORS.length];
}

const SUBJECT_COLORS = {
  yw: '#d97757', sx: '#3b7fa0', yy: '#6a9b55',
  total: '#8b6faf',
  // Paired subjects (same color within each pair, never appear together)
  wl: '#8b6faf', ls: '#8b6faf',  // 理科物理 ↔ 文科历史
  hx: '#c47f5a', dl: '#c47f5a',  // 理科化学 ↔ 文科地理
  sw: '#5a8f7b', zz: '#5a8f7b',  // 理科生物 ↔ 文科政治
};
function getSubjectColor(key) { return SUBJECT_COLORS[key] || '#888'; }

Chart.register(ChartDataLabels);

// Helper: draw a table on an offscreen canvas and return the canvas element
function drawTableOnCanvas(headers, rows, colWidths, options) {
  const pxPerMm = 10;
  const totalWidthMM = colWidths.reduce((a,b)=>a+b,0);
  const widthPx = Math.round(totalWidthMM * pxPerMm);
  const headerHm = 9;
  const rowHm = 8;
  const headerHpx = Math.round(headerHm * pxPerMm);
  const rowHpx = Math.round(rowHm * pxPerMm);
  const fontScale = pxPerMm / 4;
  const heightPx = headerHpx + rows.length * rowHpx;
  const canvas = document.createElement('canvas');
  canvas.width = widthPx;
  canvas.height = heightPx;
  const ctx = canvas.getContext('2d');
  const headerColor = (options && options.headerColor) || '#141413';
  ctx.fillStyle = headerColor;
  ctx.fillRect(0, 0, canvas.width, headerHpx);
  // Header text
  ctx.fillStyle = (options && options.headerTextColor) || '#fff';
  const fontSize = Math.max(8, Math.round((options && options.fontSize) || 14)) * fontScale;
  ctx.font = `${fontSize}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let x = 0;
  for (let i = 0; i < headers.length; i++) {
    const w = Math.round((colWidths[i] || 10) * pxPerMm);
    ctx.fillText(String(headers[i]), x + w/2, headerHpx/2);
    // vertical lines
    ctx.strokeStyle = '#e5e5e5';
    ctx.beginPath(); ctx.moveTo(x+w, 0); ctx.lineTo(x+w, canvas.height); ctx.stroke();
    x += w;
  }
  // Data rows
  ctx.fillStyle = '#000';
  ctx.font = `${fontSize}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let r = 0; r < rows.length; r++) {
    const y = headerHpx + r * rowHpx;
    // zebra background
    ctx.fillStyle = (r % 2 === 0) ? '#fff' : '#f9f9f9';
    ctx.fillRect(0, y, canvas.width, rowHpx);
    let cx = 0;
    for (let c = 0; c < headers.length; c++) {
      const w = Math.round((colWidths[c] || 10) * pxPerMm);
      const cell = rows[r][c] != null ? String(rows[r][c]) : '';
      ctx.fillStyle = '#000';
      ctx.fillText(cell, cx + w/2, y + rowHpx/2);
      // vertical line
      ctx.strokeStyle = '#e3e3e3';
      ctx.beginPath(); ctx.moveTo(cx+w, 0); ctx.lineTo(cx+w, canvas.height); ctx.stroke();
      cx += w;
    }
  }
  return canvas;
}

// Helper: convert a Chart.js chart to high-res image data URL
function chartToImage(chartInstance) {
  if (!chartInstance || !chartInstance.canvas) return null;
  try {
    const w = chartInstance.width || chartInstance.canvas.width;
    const h = chartInstance.height || chartInstance.canvas.height;
    if (!w || !h || w <= 0 || h <= 0) return null;
    if (typeof chartInstance.toBase64Image === 'function') {
      return chartInstance.toBase64Image('image/png', 2);
    }
    return chartInstance.canvas.toDataURL('image/png');
  } catch (e) {
    return null;
  }
}

// =============================================================
// SECTION 0: 联考概览
// =============================================================
function renderOverview() {
  const examName = window._examName || '联考质量分析';

  }

  const sortedStats = [...schoolStats].sort((a,b) => parseFloat(b.avgTotal||0) - parseFloat(a.avgTotal||0));
  for (let s of sortedStats) {
    html += `<tr><td><strong>${s.name}</strong></td><td>${s.count}</td><td>${s.avgTotal}</td><td>${s.maxTotal}</td></tr>`;
  }
  html += `</tbody></table></div>`;

  document.getElementById('sec-overview').innerHTML = html;
}

// =============================================================
// SECTION 1: 各校上线对比
// =============================================================
function getResult(cate) {
  if (!window._analysisResults[cate]) window._analysisResults[cate] = computeResult(cate);
  return window._analysisResults[cate];
}

function renderCutoff(cate) {
  const result = getResult(cate);
  if (result.error) { document.getElementById('sec-cutoff').innerHTML = `<div class="msg msg-error">上线对比: ${result.error}</div>`; return; }
  destroyCharts('cutoff_');

  const { validSchools, cutoffData } = result;
  const batchLines = window._batchLines[cate] || {};
  const batchNames = Object.keys(batchLines);
  const batchColors = ['#d97757','#6a9bcc','#788c5d','#8b6faf','#5a8f7b','#c47f5a'];
  const cats = window._categories || [];

  let html = `<div class="section-header"><h2>各校上线对比</h2>`;
  if (cats.length > 1) {
    html += `<div class="sub-tabs inline-cate-tabs" style="margin:0;">`;
    for (let c of cats) html += `<button class="sub-tab ${c===cate?'active':''}" onclick="switchCutoff('${c}')">${c}</button>`;
    html += `</div>`;
  }
  html += `</div>`;

  html += `<div class="chart-container"><div class="chart-title">各批次上线人数对比</div><canvas id="chart_cutoff_count_${cate}"></canvas></div>`;
  html += `<div class="chart-container"><div class="chart-title">各批次上线率对比</div><canvas id="chart_cutoff_rate_${cate}"></canvas></div>`;
  html += `<div class="table-container"><div class="table-title">各校上线数据明细</div>`;
  html += `<table class="data-table"><thead><tr><th>学校</th><th>参考人数</th>`;
  for (let batch of batchNames) html += `<th>${batch}人数</th><th>${batch}率</th>`;
  html += `</tr></thead><tbody>`;
  for (let school of validSchools) {
    const entry = cutoffData[school];
    if (!entry) continue;
    html += `<tr><td>${school}</td><td>${entry.refCount}</td>`;
    for (let batch of batchNames) {
      const b = entry.batches[batch];
      html += `<td>${b?b.totalPass:'-'}</td><td>${b?(b.totalRate*100).toFixed(1)+'%':'-'}</td>`;

// SECTION 1.5: 尖子生排名 (individual student ranking)
// =============================================================
function renderRanking(cate) {
  const rows = window._filteredRaw || [];
  const cats = window._categories || [];
  const batchLines = window._batchLines || {};
  if (!rows.length) { document.getElementById('sec-rank').innerHTML = ''; return; }

  // Determine top counts per category
  const topConfigs = { '物理': 30, '历史': 10 };
  const defaultCount = 10;

  const sorted = [...rows].filter(r => {
    const cat = (r.category || '').trim();
    return cat === cate || cat.includes(cate);
  }).sort((a, b) => b.total - a.total);

  const topN = Math.min(topConfigs[cate] || defaultCount, sorted.length);
  const topStudents = sorted.slice(0, topN);

  // Detect which subject keys have data
  const hasSubj = {};
  for (let k of ['yw','sx','yy','wl','ls','hx','sw','zz','dl']) {
    hasSubj[k] = topStudents.some(r => (r.scores[k] || 0) > 0);
  }
  const displayKeys = ['yw','sx','yy','wl','ls','hx','sw','zz','dl'].filter(k => hasSubj[k]);

  let html = `<div class="section-header"><h2>尖子生排名</h2>`;
  if (cats.length > 1) {
    html += `<div class="sub-tabs inline-cate-tabs" style="margin:0;">`;
    for (let c of cats) html += `<button class="sub-tab ${c===cate?'active':''}" onclick="switchRankCate('${c}')">${c}</button>`;
    html += `</div>`;
  }
  html += `</div>`;
  html += `<p style="color:var(--color-mid-gray);margin-bottom:16px;">${cate}类 · 总分前${topN}名学生成绩明细</p>`;

  html += `<div class="table-container"><div class="table-title">${cate}类前${topN}名成绩排名</div><div class="rank-table-wrap">`;
  html += `<table class="data-table"><thead><tr><th>排名</th><th>学校</th>`;
  for (let k of displayKeys) html += `<th>${keyToName(k)}</th>`;
  html += `<th>总分</th></tr></thead><tbody>`;
  for (let i = 0; i < topStudents.length; i++) {
    const r = topStudents[i];
    html += `<tr><td class="rank-num">${i+1}</td><td>${r.school}</td>`;
    for (let k of displayKeys) {
      const v = r.scores[k] || 0;
      html += `<td>${v > 0 ? v.toFixed(0) : '-'}</td>`;
    }
    html += `<td><strong>${r.total.toFixed(0)}</strong></td></tr>`;
  }
  html += `</tbody></table></div></div>`;

  document.getElementById('sec-rank').innerHTML = html;
}

function switchRankCate(cate) { renderRanking(cate); }

function renderTopStudents(cate) {

  const { validSchools, topData, subjKeys, coreSubjKeys, otherSubjKeys, trendLevels, trendData } = result;

    html += `<div class="sub-tabs inline-cate-tabs" style="margin:0;">`;

  html += `<div class="sub-tabs" id="topTabs_${cate}">`;

  html += `</div>`;

  for (let ci = 0; ci < topConfigs.length; ci++) {
    const cfg = topConfigs[ci];
    const active = ci === 0;
    html += `<div class="sub-tab-content ${active?'active':''}" id="topContent_${cate}_${ci}">`;
    html += `<div class="chart-container"><div class="chart-title">${cfg.label} · 语数外+总分</div><canvas id="chart_top1_${cate}_${ci}"></canvas></div>`;
    if (otherSubjKeys.length > 0) html += `<div class="chart-container"><div class="chart-title">${cfg.label} · 其他学科</div><canvas id="chart_top2_${cate}_${ci}"></canvas></div>`;
    html += `<div class="table-container"><div class="table-title">${cfg.label}均分明细</div>`;

    for (let sk of subjKeys) html += `<th>${keyToName(sk)}</th>`;
    html += `</tr></thead><tbody>`;
    for (let school of validSchools) {
      const d = topData[cfg.id].data[school];
      if (!d) continue;
      html += `<tr><td>${school}</td><td>${d.total?.toFixed(1)||'-'}</td>`;
      for (let sk of subjKeys) html += `<td>${(d[sk]||0)>0?d[sk].toFixed(1):'-'}</td>`;
      html += `</tr>`;
    }
    html += `</tbody></table></div></div>`;
  }

  if (trendLevels.length >= 2) {
    html += `<div class="chart-container"><div class="chart-title">跨层级总分均分趋势对比</div><canvas id="chart_trend_${cate}"></canvas></div>`;
  }

  document.getElementById('sec-top').innerHTML = html;

  setTimeout(() => {
    for (let ci = 0; ci < topConfigs.length; ci++) {
      renderTopLevelBars(cate, ci, topConfigs[ci], validSchools, topData[topConfigs[ci].id].data, coreSubjKeys, otherSubjKeys);
    }
    if (trendLevels.length >= 2) {
      const canvas = document.getElementById(`chart_trend_${cate}`);
      if (!canvas) return;
      const datasets = validSchools.map((s,i) => ({
        label: s, data: trendData[s]||[],
        borderColor: getSchoolColor(s), backgroundColor: getSchoolColor(s),
        pointBackgroundColor: getSchoolColor(s), pointRadius: 6, pointHoverRadius: 10,
        borderWidth: 3, hoverBorderWidth: 5, tension: 0.3, fill: false,
        datalabels: { display: false }
      }));
      chartInstances[`trend_${cate}`] = new Chart(canvas, {
        type: 'line', data: { labels: trendLevels, datasets },
        options: {
          responsive: true, maintainAspectRatio: true, aspectRatio: 2.2,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top', labels: { font: { size: 18 } } },
            tooltip: {
              backgroundColor: '#141413', titleFont: { size: 16 },
              bodyFont: { size: 15 }, padding: 12, cornerRadius: 8,
              callbacks: {
                label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1)
              }
            }
          },
          hover: { mode: 'index', intersect: false },
          scales: {
            y: { beginAtZero: false, title: { display: true, text: '总分均分', font: { size: 18 } }, ticks: { font: { size: 16 } }, grid: { color: '#e8e6dc' } },
            x: { offset: true, ticks: { font: { size: 16, weight: 'bold' } }, grid: { display: false } }
          }
        }

  }, 100);
}

function renderTopLevelBars(cate, ci, cfg, schools, data, coreKeys, otherKeys) {
  // School dimension: X = schools
  const schoolLabels = schools;
  const coreSubjectKeys = coreKeys.filter(k => k !== 'total'); // yw, sx, yy

  // Chart 1: Core subjects (语数外) as bars on left Y + 总分 as scatter on right Y
  const cvs1 = document.getElementById(`chart_top1_${cate}_${ci}`);
  if (cvs1) {
    destroyChart(`top1_${cate}_${ci}`);
    // Compute data-driven Y-axis ranges for better visibility
    let barMin = Infinity, barMax = -Infinity;
    for (let sk of coreSubjectKeys) {
      for (let s of schools) {
        const v = data[s]?.[sk] || 0;
        if (v < barMin) barMin = v;
        if (v > barMax) barMax = v;
      }
    }
    let totalMin = Infinity, totalMax = -Infinity;
    for (let s of schools) {
      const v = data[s]?.total || 0;
      if (v < totalMin) totalMin = v;
      if (v > totalMax) totalMax = v;
    }
    // Left Y: bars fill ~58% of chart (from 0), leaving upper area for total dots
    const yMin = 0;
    const yMax = barMax / 0.58;

    // Right Y: map [totalMin,totalMax] to ~65%-88% of chart height (clearly above bars)
    const totalRange = Math.max(totalMax - totalMin, 1);
    const y1Min = totalMin - 2.83 * totalRange;
    const y1Max = totalMax + 0.52 * totalRange;

    const barDatasets = coreSubjectKeys.map((sk, si) => ({
      type: 'bar', label: keyToName(sk),
      data: schools.map(s => data[s]?.[sk] || 0),
      backgroundColor: getSubjectColor(sk),
      borderRadius: 4, yAxisID: 'y',
      datalabels: { anchor: 'end', align: 'end', offset: 20, color: '#333', font: { weight: 'bold', size: 15 }, formatter: v => v>0?v.toFixed(1):'' }
    }));
    const totalDataset = {
      type: 'line', label: '总分',
      data: schools.map(s => data[s]?.total || 0),
      borderColor: SUBJECT_COLORS.total, backgroundColor: 'transparent',
      pointBackgroundColor: SUBJECT_COLORS.total, pointRadius: 10, pointBorderColor: '#fff', pointBorderWidth: 2,
      showLine: false, yAxisID: 'y1', fill: false,
      datalabels: { anchor: 'end', align: 'top', offset: 24, color: SUBJECT_COLORS.total, font: { weight: 'bold', size: 17 }, formatter: v => v>0?v.toFixed(1):'' }
    };
    chartInstances[`top1_${cate}_${ci}`] = new Chart(cvs1, {
      type: 'bar', data: { labels: schoolLabels, datasets: [...barDatasets, totalDataset] },
      options: {
        responsive: true, maintainAspectRatio: true, aspectRatio: 2,
        plugins: {
          legend: { position: 'top', labels: { font: { size: 18 } } },
          datalabels: { display: ctx => ctx.dataset.type !== 'line' || ctx.dataset.label === '总分' }
        },
        scales: {
          y: { min: yMin, max: yMax, title: { display: true, text: '语数外均分', font: { size: 18 } }, ticks: { font: { size: 16 } }, grid: { color: '#e8e6dc' } },
          y1: { min: y1Min, max: y1Max, position: 'right', ticks: { display: false }, grid: { display: false } },
          x: { ticks: { font: { size: 16 } }, grid: { display: false } }
        }
      }
    });
  }

  // Chart 2: Other subjects — also school dimension
  if (otherKeys.length > 0) {
    const cvs2 = document.getElementById(`chart_top2_${cate}_${ci}`);
    if (cvs2) {
      destroyChart(`top2_${cate}_${ci}`);
      // Compute data-driven Y range for other subjects
      let otherMin = Infinity, otherMax = -Infinity;
      for (let sk of otherKeys) {
        for (let s of schools) {
          const v = data[s]?.[sk] || 0;
          if (v < otherMin) otherMin = v;
          if (v > otherMax) otherMax = v;
        }
      }
      const otherMargin = Math.max(5, (otherMax - otherMin) * 0.15);
      const otherYMin = Math.max(0, otherMin - otherMargin);
      const otherDatasets = otherKeys.map((sk, si) => ({
        label: keyToName(sk),
        data: schools.map(s => data[s]?.[sk] || 0),
        backgroundColor: getSubjectColor(sk),
        borderRadius: 4,
        datalabels: { anchor: 'end', align: 'end', offset: 20, color: '#333', font: { weight: 'bold', size: 15 }, formatter: v => v>0?v.toFixed(1):'' }
      }));
      chartInstances[`top2_${cate}_${ci}`] = new Chart(cvs2, {
        type: 'bar', data: { labels: schoolLabels, datasets: otherDatasets },
        options: {
          responsive: true, maintainAspectRatio: true, aspectRatio: 2,
          plugins: {
            legend: { position: 'top', labels: { font: { size: 18 } } },
          },
          scales: { y: { min: otherYMin, title: { display: true, text: '均分', font: { size: 18 } }, ticks: { font: { size: 16 } }, grid: { color: '#e8e6dc' } }, x: { ticks: { font: { size: 16 } }, grid: { display: false } } }
        }
      });
    }
  }
}

function switchTopCate(cate) { destroyCharts('top_'); renderTopStudents(cate); }

function switchTopTab(cate, idx) {
  const tabs = document.querySelectorAll(`#topTabs_${cate} .sub-tab`);
  const container = document.getElementById('sec-top');
  const contents = container.querySelectorAll(`[id^="topContent_${cate}_"]`);
  tabs.forEach((t,i) => t.classList.toggle('active', i===idx));
  contents.forEach((c,i) => c.classList.toggle('active', i===idx));
  // Lazy render hidden tab charts
  const k1 = `top1_${cate}_${idx}`;
  if (!chartInstances[k1]) {
    const result = getResult(cate);
    const topConfigs = [{id:'top30',label:'前30名'},{id:'top100',label:'前100名'},{id:'top200',label:'前200名'}];
    renderTopLevelBars(cate, idx, topConfigs[idx], result.validSchools, result.topData[topConfigs[idx].id].data, result.coreSubjKeys, result.otherSubjKeys);
  }
}

function renderElite(cate) {
  const result = getResult(cate);
  if (result.error) { document.getElementById('sec-elite').innerHTML = `<div class="msg msg-error">优秀生分布: ${result.error}</div>`; return; }
  destroyCharts('elite_');

  const { validSchools, eliteData, eliteThresholds } = result;
  const cats = window._categories || [];

  let html = `<div class="section-header"><h2>优秀生分布</h2>`;
  if (cats.length > 1) {
    html += `<div class="sub-tabs inline-cate-tabs" style="margin:0;">`;
    for (let c of cats) html += `<button class="sub-tab ${c===cate?'active':''}" onclick="switchEliteCate('${c}')">${c}</button>`;
    html += `</div>`;
  }
  html += `</div>`;

  // Single combined chart: X = thresholds, each bar = 100% stacked by school
  const thresholdLabels = eliteThresholds.map(t => `前${t}名`);
  html += `<div class="chart-container"><div class="chart-title">各校优秀生分布对比</div><canvas id="chart_elite_${cate}"></canvas></div>`;

  // Single combined table
  html += `<div class="table-container"><div class="table-title">优秀生各校人数及占比明细</div>`;
  html += `<table class="data-table"><thead><tr><th>学校</th>`;
  for (let t of eliteThresholds) html += `<th>前${t}名人数</th><th>前${t}名占比</th>`;
  html += `</tr></thead><tbody>`;
  for (let school of validSchools) {
    html += `<tr><td>${school}</td>`;
    for (let t of eliteThresholds) {
      const ed = eliteData[t];
      const cnt = ed.counts[school] || 0;
      const pct = ed.total > 0 ? (cnt / ed.total * 100) : 0;
      html += `<td>${cnt}</td><td>${pct.toFixed(1)}%</td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;

  document.getElementById('sec-elite').innerHTML = html;

  // Single chart with all thresholds as 100% stacked bars
  setTimeout(() => {
    const canvas = document.getElementById(`chart_elite_${cate}`);
    if (!canvas) return;

    // Sort schools by total presence across all thresholds
    const schoolTotals = {};
    for (let school of validSchools) {
      schoolTotals[school] = eliteThresholds.reduce((sum, t) => sum + (eliteData[t].counts[school] || 0), 0);
    }
    const sortedSchools = [...validSchools].sort((a,b) => (schoolTotals[b]||0) - (schoolTotals[a]||0));

    const datasets = sortedSchools.map((s, si) => ({
      label: s,
      data: eliteThresholds.map(t => ((eliteData[t].counts[s]||0) / Math.max(eliteData[t].total, 1) * 100)),
      backgroundColor: getSchoolColor(s),
      borderRadius: 0,
      barPercentage: 0.45,
      categoryPercentage: 0.7,
    }));

    chartInstances[`elite_${cate}`] = new Chart(canvas, {
      type: 'bar',
      data: { labels: thresholdLabels, datasets },
      options: {
        responsive: true, maintainAspectRatio: true, aspectRatio: 2,
        plugins: {
          legend: { position: 'top', labels: { font: { size: 18 } } },
          datalabels: {
            display: ctx => {
              const cnt = (eliteData[eliteThresholds[ctx.dataIndex]].counts[sortedSchools[ctx.datasetIndex]]||0);
              const pct = ctx.dataset.data[ctx.dataIndex];
              return cnt > 0 && pct > 5;
            },
            anchor: 'center', color: '#fff', font: { weight: 'bold', size: 14 },
            formatter: function(v, ctx) {
              const cnt = (eliteData[eliteThresholds[ctx.dataIndex]].counts[sortedSchools[ctx.datasetIndex]]||0);
              return cnt > 0 ? cnt : '';
            },
          },
          tooltip: {
            callbacks: {
              label: ctx => `${ctx.dataset.label}: ${(eliteData[eliteThresholds[ctx.dataIndex]].counts[sortedSchools[ctx.datasetIndex]]||0)}人 (${ctx.parsed.y.toFixed(1)}%)`,
            }
          }
        },
        scales: {
          x: { stacked: true, ticks: { font: { size: 18, weight: 'bold' } }, grid: { display: false } },
          y: { stacked: true, beginAtZero: true, max: 100, ticks: { font: { size: 16 }, callback: v => v + '%' }, grid: { color: '#e8e6dc' }, title: { display: true, text: '占比 (%)', font: { size: 18 } } },
        }
      }
    });
  }, 100);
}

function renderContribution(cate) {
  const result = getResult(cate);
  if (result.error) { document.getElementById('sec-contrib').innerHTML = `<div class="msg msg-error">贡献度: ${result.error}</div>`; return; }
  if (!result.contribResult) { document.getElementById('sec-contrib').innerHTML = `<div class="msg msg-info">贡献度分析需要单科分数线</div>`; return; }
  destroyCharts('contrib_');

  const { validSchools, contribResult, contribMainBatch, subjKeys } = result;
  const cats = window._categories || [];
  const schoolsWithData = validSchools.filter(s => contribResult.schools[s] && Object.keys(contribResult.schools[s]).length > 0);

  let html = `<div class="section-header"><h2>学科贡献度分析</h2>`;
  if (cats.length > 1) {
    html += `<div class="sub-tabs inline-cate-tabs" style="margin:0;">`;
    for (let c of cats) html += `<button class="sub-tab ${c===cate?'active':''}" onclick="switchContribCate('${c}')">${c}</button>`;
    html += `</div>`;
  }
  html += `</div>`;
  html += `<div class="desc" style="margin-bottom:16px;color:var(--color-mid-gray);">以"${contribMainBatch}"线为基准</div>`;

  // School tabs
  if (schoolsWithData.length > 1) {
    html += `<div class="sub-tabs" id="contribSchoolTabs_${cate}">`;
    for (let si = 0; si < schoolsWithData.length; si++) html += `<button class="sub-tab ${si===0?'active':''}" onclick="switchContribSchool('${cate}',${si})">${schoolsWithData[si]}</button>`;
    html += `</div>`;
  }

  for (let si = 0; si < schoolsWithData.length; si++) {
    const school = schoolsWithData[si];
    const sc = contribResult.schools[school];
    const active = si === 0;
    html += `<div class="sub-tab-content ${active?'active':''}" id="contribContent_${cate}_${si}">`;

    // Bubble chart
    html += `<div class="chart-container"><div class="chart-title">${school}各学科贡献率×命中率</div><canvas id="chart_contrib_${cate}_${si}"></canvas></div>`;

    // Table
    html += `<div class="table-container"><div class="table-title">${school}各科贡献度明细</div>`;
    html += `<table class="data-table"><thead><tr><th>学科</th><th>贡献率</th><th>命中率</th><th>双上线</th><th>参考人数</th><th>等级</th></tr></thead><tbody>`;
    for (let sk of subjKeys) {
      const d = sc[sk];
      if (!d || d.refCount === 0) continue;
      html += `<tr><td>${keyToName(sk)}</td><td>${(d.contribRate*100).toFixed(1)}%</td><td>${(d.hitRate*100).toFixed(1)}%</td><td>${d.doublePass}</td><td>${d.refCount}</td><td><strong>${d.grade}</strong></td></tr>`;
    }
    html += `</tbody></table></div>`;
    html += `</div>`;
  }

  document.getElementById('sec-contrib').innerHTML = html;

  setTimeout(() => {
    for (let si = 0; si < schoolsWithData.length; si++) {
      renderContribChart(cate, si, schoolsWithData[si], contribResult.schools[schoolsWithData[si]], subjKeys);
    }
  }, 100);
}

function renderContribChart(cate, si, school, sc, subjKeys) {
  const canvas = document.getElementById(`chart_contrib_${cate}_${si}`);
  if (!canvas) return;
  destroyChart(`contrib_${cate}_${si}`);

  const subjectLabels = subjKeys.map(keyToName);
  const datasets = [];
  let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;

  for (let sk of subjKeys) {
    const d = sc[sk];
    if (!d || d.refCount === 0) continue;
    const color = getSubjectColor(sk);
    const xVal = d.contribRate * 100;
    const yVal = d.hitRate * 100;
    xMin = Math.min(xMin, xVal);
    xMax = Math.max(xMax, xVal);
    yMin = Math.min(yMin, yVal);
    yMax = Math.max(yMax, yVal);
    datasets.push({
      label: keyToName(sk),
      data: [{ x: xVal, y: yVal, r: 8 }],
      backgroundColor: color + '88',
      borderColor: color,
      borderWidth: 2,
    });
  }

  // Smart axis scaling with padding
  const xPad = Math.max((xMax - xMin) * 0.15, 5);
  const yPad = Math.max((yMax - yMin) * 0.15, 5);
  const smartXMin = Math.max(0, Math.floor(xMin - xPad));
  const smartXMax = Math.min(100, Math.ceil(xMax + xPad));
  const smartYMin = Math.max(0, Math.floor(yMin - yPad));
  const smartYMax = Math.min(100, Math.ceil(yMax + yPad));

  chartInstances[`contrib_${cate}_${si}`] = new Chart(canvas, {
    type: 'bubble',
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: true, aspectRatio: 2,
      animation: false,
      plugins: {
        legend: { position: 'top', labels: { font: { size: 18 } } },
        tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: 贡献率=${ctx.raw.x.toFixed(1)}%, 命中率=${ctx.raw.y.toFixed(1)}%` } },
        datalabels: { display: false }
      },
      scales: {
        x: { min: smartXMin, max: smartXMax, title: { display: true, text: '贡献率 (%)', font: { size: 18 } }, ticks: { font: { size: 16 }, callback: v => v + '%' }, grid: { color: '#e8e6dc' } },
        y: { min: smartYMin, max: smartYMax, title: { display: true, text: '命中率 (%)', font: { size: 18 } }, ticks: { font: { size: 16 }, callback: v => v + '%' }, grid: { color: '#e8e6dc' } },
      }
    }
  });
}

function switchContribCate(cate) { destroyCharts('contrib_'); renderContribution(cate); }

function switchContribSchool(cate, idx) {
  const container = document.getElementById('sec-contrib');
  const tabs = container.querySelectorAll(`#contribSchoolTabs_${cate} .sub-tab`);
  const contents = container.querySelectorAll(`[id^="contribContent_${cate}_"]`);
  tabs.forEach((t,i) => t.classList.toggle('active', i===idx));
  contents.forEach((c,i) => c.classList.toggle('active', i===idx));
  const k = `contrib_${cate}_${idx}`;
  if (!chartInstances[k]) {
    const result = getResult(cate);
    const schoolsWithData = result.validSchools.filter(s => result.contribResult.schools[s] && Object.keys(result.contribResult.schools[s]).length > 0);
    renderContribChart(cate, idx, schoolsWithData[idx], result.contribResult.schools[schoolsWithData[idx]], result.subjKeys);
  }
}

// =============================================================
// MAIN GENERATION
// =============================================================
function generateAnalysis() {
  if (!rawData) {
    showMsg('configMsg', '请先上传数据文件', 'error');
    return;
  }

  const selectedSchools = [];
  document.querySelectorAll('#schoolCheckboxes input[type="checkbox"]:checked').forEach(cb => {
    selectedSchools.push(cb.value);
  });
  if (selectedSchools.length < 2) {
    showMsg('configMsg', '请至少选择2所学校', 'error');
    return;
  }

  // Read batch cutoffs per category
  const batchLines = {};
  const cateList = ['物理', '历史'];
  const subjKeys = ['yw','sx','yy','wl','ls','hx','sw','zz','dl'];
  let hasData = false;
  for (let cate of cateList) {
    const tb = document.getElementById(`batchTableBody_${cate}`);
    if (!tb) continue;
    const cateLines = {};
    tb.querySelectorAll('tr').forEach(tr => {
      const inputs = tr.querySelectorAll('input');
      if (inputs.length === 0) return;
      const batch = tr.dataset.batch;
      if (!batch) return;
      const line = { total: parseFloat(inputs[0].value) || 0 };
      for (let i = 0; i < subjKeys.length; i++) {
        line[subjKeys[i]] = parseFloat(inputs[i + 1].value) || 0;
      }
      if (line.total > 0) hasData = true;
      cateLines[batch] = line;
    });
    batchLines[cate] = cateLines;
  }

  if (!hasData) {
    showMsg('configMsg', '请填写至少一个批次的划线数据', 'error');
    return;
  }

  showMsg('configMsg', '');
  document.getElementById('loadingOverlay').classList.add('active');

  // Filter to selected schools
  const filteredRaw = rawData.rows.filter(r => selectedSchools.includes(r.school));

  const examName = document.getElementById('examName').value || '联考质量分析';

  // Build cate tabs - detect from data or infer from subjects
  let categories = [...new Set(filteredRaw.map(r => r.category))].filter(c => c);
  if (categories.length === 0) {
    // No category column: check if we have both 物理 and 历史 subject scores
    const hasPhysics = filteredRaw.some(r => r.scores.wl > 0);
    const hasHistory = filteredRaw.some(r => r.scores.ls > 0);
    if (hasPhysics && hasHistory) {
      // Split by subject: students with 物理 scores go to 物理, etc.
      categories = ['物理', '历史'];
      // Assign categories based on subjects
      filteredRaw.forEach(r => {
        if (r.scores.wl > 0) r.category = '物理';
        else if (r.scores.ls > 0) r.category = '历史';
        else r.category = '综合';
      });
    } else {
      categories = ['综合'];
      filteredRaw.forEach(r => r.category = '综合');
    }
  }

  // Store results & compute data for all categories
  for (let key in chartInstances) {
    try { chartInstances[key].destroy(); } catch(e) {}
    delete chartInstances[key];
  }
  window._analysisResults = {};
  window._selectedSchools = selectedSchools;
  window._schoolOrder = [...selectedSchools].sort((a, b) => a.localeCompare(b, 'zh-CN'));
  window._batchLines = batchLines;
  window._examName = examName;
  window._categories = categories;
  window._filteredRaw = filteredRaw;

  // Render all sections with default category
  const defaultCate = categories[0];
  renderOverview();
  renderCutoff(defaultCate);
  renderRanking(defaultCate);
  renderTopStudents(defaultCate);
  renderTopPct(defaultCate);
  renderElite(defaultCate);
  renderContribution(defaultCate);

  document.getElementById('resultsArea').style.display = 'block';
  document.getElementById('btnExportPDF').disabled = false;
  document.getElementById('btnExportPDF').textContent = '📦 导出图表';

  document.getElementById('loadingOverlay').classList.remove('active');
  document.getElementById('headerMeta').textContent = `${examName} · ${selectedSchools.length}校对比`;

  // Smooth scroll to results
  document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth' });
}
